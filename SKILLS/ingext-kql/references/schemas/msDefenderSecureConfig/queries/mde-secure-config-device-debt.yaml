description: >-
  Per-device hardening debt: the applicable controls each device fails, summed by
  configuration impact, enriched from msDefenderMachine with the device group,
  management channel and exposure level. Devices no MDM manages (managedBy
  'Unknown') are usually the ones that drift, so the join earns its cost. The
  FailedControls column lists the configuration ids so the row is actionable
  without a second query; take a configurationId back to
  mde-secure-config-failing-controls.yaml for its fleet-wide picture.
datatype: msDefenderSecureConfig
kql: |
  let DeviceDebt =
      msDefenderSecureConfig
      | where isApplicable == true and isCompliant == false
      | summarize
          FailedCount    = count(),
          DebtImpact     = sum(configurationImpact),
          UserImpacting  = countif(isExpectedUserImpact == true),
          FailedControls = make_set(configurationId, 20)
          by DeviceId = deviceId;
  DeviceDebt
  | join kind=leftouter (
        msDefenderMachine
        | where isnull(mergedIntoMachineId) and isExcluded != true
        | project MachineId = id, computerDnsName, osPlatform, version,
                  exposureLevel, riskScore, deviceValue, managedBy, rbacGroupName,
                  LastSeen = todatetime(lastSeen)
    ) on $left.DeviceId == $right.MachineId
  | project
      computerDnsName,
      DeviceId,
      DebtImpact,
      FailedCount,
      UserImpacting,
      exposureLevel,
      riskScore,
      deviceValue,
      managedBy,
      rbacGroupName,
      osPlatform,
      version,
      LastSeen,
      FailedControls
  | order by DebtImpact desc, FailedCount desc
tags: [microsoft, defender, mde, mdvm, secure-configuration, hardening, device, remediation, security]
expected_output: |
  Devices carrying the most misconfiguration debt (sanitized).

