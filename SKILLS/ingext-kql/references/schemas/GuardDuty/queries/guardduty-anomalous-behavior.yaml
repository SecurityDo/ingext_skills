  2026-09-02T15:03:31.037Z  2         Discovery:IAMUser/AnomalousBehavior      helpdesk   AIDAEXAMPLEPRINCIPAL1  IAMUser   192.0.2.47  EXAMPLE NETWORKS LTD  Example Country  16        4         all succeeded  180          asnNumber: 64496 asnOrg: EXAMPLE NETWORKS LTD  browser                   00000000000000000000000000000011

