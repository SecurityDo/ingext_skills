  LIVE  2026-09-02T15:03:30.978Z  5    InitialAccess:IAMUser/AnomalousBehavior  helpdesk  159          13.9  13.5          11.4         0.2           0.2         2026-09-02T14:49:59.000Z  2026-09-02T15:01:24.000Z  CloudTrailManagementEvent  123456789012  af-south-1
