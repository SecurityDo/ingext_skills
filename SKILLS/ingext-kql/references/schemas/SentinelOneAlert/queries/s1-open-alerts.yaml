description: >-
  Open SentinelOne alert triage: lists Singularity/Unified alerts that are still
  NEW or IN_PROGRESS, prioritizing CRITICAL/HIGH severity and malicious
  confidence. Shows the affected host, classification, the triggering process and
  its parent, the mitigation result (NOT_MITIGATED needs manual response), and
  the SHA-256 for hunting. Ordered to surface the newest, most severe alerts
  first.
datatype: SentinelOneAlert
kql: |
  SentinelOneAlert
  | where status in ("NEW", "IN_PROGRESS")
  | extend Sev = case(severity == "CRITICAL", 4, severity == "HIGH", 3, severity == "MEDIUM", 2, 1)
  | project
      timestamp,
      Host = tostring(asset.name),
      Severity = severity,
      Classification = classification,
      Confidence = confidenceLevel,
      Alert = name,
      Product = tostring(detectionSource.product),
      ParentProcess = tostring(process.parentName),
      CmdLine = tostring(process.cmdLine),
      Result = result,
      AnalystVerdict = analystVerdict,
      Sha256 = tostring(process.file.sha256),
      Sev,
      id
  | order by Sev desc, timestamp desc
  | project-away Sev
tags: [sentinelone, edr, alerts, incident-response, triage, security]
expected_output: |
  Open alerts ranked by severity with process context (sanitized).

  timestamp                 Host     Severity  Classification  Confidence  Alert                                      Product  ParentProcess  CmdLine                                              Result     AnalystVerdict           Sha256                                                            id
