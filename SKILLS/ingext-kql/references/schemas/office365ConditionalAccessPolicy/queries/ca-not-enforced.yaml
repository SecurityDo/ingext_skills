description: >-
  Lists Conditional Access policies that are configured but not enforcing —
  report-only (enabledForReportingButNotEnforced) or disabled — with what they
  would enforce and when they were last changed. Report-only policies are
  evaluated and logged in sign-in logs but never block or prompt, so a block or
  MFA policy left in report-only for months is a protection the tenant believes
  it has but does not. Microsoft-managed policies are shown with their templateId.
datatype: office365ConditionalAccessPolicy
kql: |
  office365ConditionalAccessPolicy
  | where state != "enabled"
  | extend Grant = iff(isnull(grantControls), "", strcat_array(grantControls.builtInControls, ",")),
      AuthStrength = tostring(grantControls.authenticationStrength.displayName),
      Modified = todatetime(modifiedDateTime),
      Created = todatetime(createdDateTime)
  | extend LastChange = iff(isnull(Modified), Created, Modified)
  | extend DaysSinceChange = datetime_diff('day', now(), LastChange)
  | project displayName, state, Grant, AuthStrength, LastChange, DaysSinceChange, templateId
  | order by state asc, DaysSinceChange desc
tags: [office365, entra-id, conditional-access, report-only, posture, security-hygiene]
expected_output: |
  Report-only and disabled policies, stalest first within each state (sanitized, abridged).

