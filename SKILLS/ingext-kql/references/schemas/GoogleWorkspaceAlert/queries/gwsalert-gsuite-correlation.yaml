  alex.wilber@contoso.com  HIGH      1       ["Government attack warning"]                       2026-07-27T04:19:55Z     2026-07-27T04:19:55Z      9       0                 0         ["US"]         ["Example ISP"]                    0            []                                               0               0
  adele.vance@contoso.com  HIGH      2       ["User reported spam spike"]                        2026-07-28T13:52:29Z     2026-07-28T13:52:29Z      11      0                 1         ["US"]         ["Example ISP"]                    1            ["Google Chrome"]               yes              0               0
