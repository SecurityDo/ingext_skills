description: >-
  Alert Center feed overview: what Google is actually raising for this tenant,
  broken out by source, alert type and payload class. Run it first — which alert
  types appear depends on the tenant's licensing (DLP, Security Center rules and
  Context-Aware alerts need Enterprise/Frontline tiers) and on which Admin
  console notifications are switched on, so a detection written for an alert type
  the tenant never produces returns nothing forever. The two count columns are
  the point of the query: Records is rows and Alerts is dcount(alertId), and
  RecordsPerAlert shows the message fan-out described in trap 1 — a Gmail
  phishing row with RecordsPerAlert 15 means one alert occupies fifteen records,
  which is exactly how a naive count() overstates the alert volume. Payload is
  the field to pin before reaching into `data`.
datatype: GoogleWorkspaceAlert
kql: |
  GoogleWorkspaceAlert
  | where timestamp > ago(30d)
  // one alert can be re-emitted when its triage state changes: keep the newest
  | extend LastUpdate = todatetime(updateTime)
  | summarize arg_max(LastUpdate, *) by alertId, messageIndex
  | extend Payload = tostring(split(tostring(data["@type"]), "alertcenter.type.")[1])
  | summarize
      Alerts = dcount(alertId),
      Records = count(),
      High = dcountif(alertId, tostring(metadata.severity) == "HIGH"),
      Open = dcountif(alertId, tostring(metadata.status) in ("NOT_STARTED", "IN_PROGRESS")),
      Unrated = dcountif(alertId, isempty(tostring(metadata.severity))),
      LastSeen = max(timestamp)
      by Source = tostring(source), Type = tostring(type), Payload
  | extend RecordsPerAlert = round(todouble(Records) / todouble(Alerts), 1)
  | project Source, Type, Payload, Alerts, Records, RecordsPerAlert, High, Open, Unrated, LastSeen
  | order by Alerts desc
tags: [google-workspace, alert-center, overview, coverage, triage, security]
expected_output: |
