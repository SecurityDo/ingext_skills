description: >-
  Devices where Microsoft Defender Antivirus is not actually protecting: not in
  active mode, security intelligence or engine out of date, definitions older than
  two days, or the last scan failed. This is a different question from EDR sensor
  health in msDefenderMachine — a device can be healthStatus Active and have AV
  disabled. Note the typing: avMode is a string-typed integer ("0" = Active) and
  the up-to-date fields are the strings "True"/"False"/"Unknown", so all
  comparisons here are string comparisons. Passive mode (1/5) is normal where a
  third-party AV is primary, so it is reported but ranked below Disabled and
  EDRBlocked.
datatype: msDefenderAvHealth
kql: |
  msDefenderAvHealth
  | extend
      AvModeName    = case(avMode == "0", "Active", avMode == "1", "Passive",
                           avMode == "2", "Disabled", avMode == "4", "EDRBlocked",
                           avMode == "5", "PassiveAudit", "Other"),
      SignatureAge  = datetime_diff('hour', now(), todatetime(avSignatureUpdateTime))
  | extend
      NoActiveAv    = avMode in ("2", "4"),
      PassiveAv     = avMode in ("1", "5"),
      SigOutOfDate  = avIsSignatureUpToDate =~ "False" or SignatureAge > 48,
      EngineOld     = avIsEngineUpToDate =~ "False",
      PlatformOld   = avIsPlatformUpToDate =~ "False",
      ScanFailed    = quickScanResult == "Failed" or fullScanResult == "Failed"
  | where NoActiveAv or PassiveAv or SigOutOfDate or EngineOld or PlatformOld or ScanFailed
  | extend Reasons = strcat_array(pack_array(
      iff(NoActiveAv, strcat("no-active-av:", AvModeName), ""),
      iff(PassiveAv, strcat("passive:", AvModeName), ""),
      iff(SigOutOfDate, "signatures-stale", ""),
      iff(EngineOld, "engine-outdated", ""),
      iff(PlatformOld, "platform-outdated", ""),
      iff(ScanFailed, "scan-failed", "")), " ")
  | project
      computerDnsName,
      machineId,
      AvModeName,
      Reasons,
      SignatureAgeHours = SignatureAge,
      avSignatureVersion,
      avIsSignatureUpToDate,
      avEngineVersion,
      avPlatformVersion,
      quickScanResult,
      quickScanError,
      LastQuickScan = todatetime(quickScanTime),
      osPlatform,
      osVersion,
      rbacGroupName,
      LastSeen = todatetime(lastSeenTime)
  | order by NoActiveAv desc, SignatureAgeHours desc
tags: [microsoft, defender, mde, antivirus, av, posture, compliance, hygiene, security]
expected_output: |
  Devices with an antivirus protection gap, worst first (sanitized).

