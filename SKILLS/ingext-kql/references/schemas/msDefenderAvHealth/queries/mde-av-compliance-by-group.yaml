  Windows Workstations  Windows11          184      181       2          1           180           4                0                 11                 0                96                      98.4
  Servers               WindowsServer2022  14       14        0          0           14            0                0                 14                 0                21                      100
  Unassigned            Windows11          7        5         2          0           6             1                0                 3                  0                73                      71.4
