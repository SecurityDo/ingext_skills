description: >-
  Expand one or more security recommendations into the devices they affect. The
  recommendation record holds counts but no device information at all, so the
  device list always comes from a join, and which table to join depends on the id
  prefix: 'sca-_-scid-NNN' recommendations resolve through
  msDefenderSecureConfig.recommendationReference (non-compliant, applicable
  devices), 'va-_-vendor-_-product' recommendations through
  msDefenderVulnerability.RecommendationReference (devices with an open CVE on
  that product). Both branches are unioned here, so the query works whichever kind
  of id is set in Recommendations — and because the parameter is a list, ids of
  both kinds expand together. A single id may be given as a bare string
  ("sca-_-scid-2513") instead of a list. Findings counts failed configurations on
  the secure-config side and distinct CVEs on the vulnerability side;
  count_distinct is deliberate there, because dcount's estimate is off by up to a
  percent and this number is read per device. Enriched from msDefenderMachine and
  ordered by business value first, so the devices worth remediating first come
  first.
datatype: msDefenderRecommendation
kql: |
  let Recommendations = dynamic([
      "sca-_-scid-2513",
      "va-_-microsoft-_-windows_11"
  ]);
  let ConfigDevices =
      msDefenderSecureConfig
      | where recommendationReference in (Recommendations)
      | where isApplicable == true and isCompliant == false
      | summarize Findings = count(), Configurations = make_set(configurationName, 5)
                  by DeviceId = deviceId, DeviceName = deviceName
      | extend Source = "secure-config",
               Detail = strcat_array(Configurations, "; ")
      | project DeviceId, DeviceName, Findings, Detail, Source;
  let VulnDevices =
      msDefenderVulnerability
      | where RecommendationReference in (Recommendations) and isnotempty(CveId)
      | summarize Findings = count_distinct(CveId), MaxCvss = max(CvssScore)
                  by DeviceId, DeviceName
      | extend Source = "vulnerability",
               Detail = strcat(tostring(Findings), " CVEs, max CVSS ", tostring(MaxCvss))
      | project DeviceId, DeviceName, Findings, Detail, Source;
  union ConfigDevices, VulnDevices
  | join kind=leftouter (
        msDefenderMachine
        | where isnull(mergedIntoMachineId) and isExcluded != true
        | project MachineId = id, osPlatform, version, exposureLevel, riskScore,
                  deviceValue, managedBy, rbacGroupName, LastSeen = todatetime(lastSeen)
    ) on $left.DeviceId == $right.MachineId
  | project
      DeviceName, DeviceId, Source, Findings, Detail, exposureLevel, riskScore,
      deviceValue, managedBy, rbacGroupName, osPlatform, version, LastSeen
  | order by case(deviceValue == "High", 3, deviceValue == "Normal", 2, 1) desc,
             Findings desc, DeviceName asc
tags: [microsoft, defender, mde, mdvm, recommendations, remediation, join, device, security]
expected_output: |
  Devices affected by the selected recommendations (sanitized). A device appears
  once per branch, so one that both fails a configuration and carries CVEs is
  listed twice, told apart by Source. A device with no msDefenderMachine record
  keeps its row with the enrichment columns empty.

