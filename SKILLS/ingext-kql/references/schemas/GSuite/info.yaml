schema: GSuite
description: >-
  Google Workspace (GSuite) audit activity collected by Ingext from the Google
  Admin SDK Reports API (activities.list, resource kind
  admin#reports#activity). One record is one audited action. Like the Office365
  audit stream this is a single wide, sparse schema, but the shape is nested
  rather than flat: every record carries the same small envelope

      kind / etag / ipAddress / ownerDomain
      id.{time, uniqueQualifier, applicationName, customerId}
      actor.{email, profileId, callerType, key}
      event.{type, name, parameters}

  and everything specific to the action lives inside the free-form
  event.parameters bag. Two discriminators select what that bag contains:

    * id.applicationName — which Reports API report the record came from
      (login, token, drive, calendar, admin, groups, saml, user_accounts, ...).
      This is the coarse selector and the closest analogue of Office365
      'Workload'.
    * event.type — the activity category inside that report (login, auth,
      access, acl_change, event_change, notification, ...), and event.name the
      individual action (login_success, authorize, view, change_user_access).

  Use the per-field 'applicableEventTypes' list below to know whether a
  parameter is populated for the activity you are querying, and always pin
  id.applicationName and/or event.type before filtering on a parameter — the
  same key can mean different things in different reports, and an unpinned
  filter silently mixes Drive, Calendar and OAuth activity into one result set.

  The record is stored as a dynamic JSON document, so nested fields are reached
  with dot notation (actor.email, event.parameters.doc_title) and array
  parameters need mv-expand (event.parameters.scope,
  event.parameters.new_value, event.parameters.accessed_url,
  event.parameters.login_challenge_method).

  Six traps are worth knowing before writing a query:

    1. 'id' is an OBJECT, not the record identifier. The event time is
       id.time and the per-event identifier is id.uniqueQualifier — there is
       no top-level scalar 'id'. The 'timestamp' column is converted from
       id.time.
    2. event.parameters is already FLATTENED into a keyed object. The raw
       Reports API returns parameters as an array of
       {name, value|multiValue|boolValue|intValue} objects; Ingext collapses
       that to parameters.<name> = <value>, with multiValue becoming a JSON
       array, boolValue a real Boolean and intValue a number. Do not write
       mv-expand over event.parameters itself.
    3. ipAddress (and therefore the _ip GeoIP enrichment) is absent whenever
       Google attributes the action to a server rather than a client — most
       Drive events generated by an add-on or by background processing, and
       many Calendar records. `where ipAddress != ""` quietly drops them.
    4. Drive records the same user action several times when several
       documents or ACL entries are touched. Filter
       `event.parameters.primary_event == true` for any count of "how many
       times did the user do X"; the secondary rows carry the same doc_id and
       actor and will double-count otherwise.
    5. Calendar start_time / end_time are NOT Unix epoch seconds. They are
       seconds since 0001-01-01T00:00:00 UTC (Google's internal epoch), so
       63921625200 is 2026-08-06T15:00:00Z, not 3995. Convert with
       `datetime(0001-01-01) + 1s * tolong(event.parameters.start_time)`
       (or subtract 62135596800 to get Unix seconds). The mobile report uses a
       different convention again — LAST_SYNC_AUDIT_DATE is Unix MILLISECONDS
       (unixtime_milliseconds_todatetime()). There is no single time
       convention across reports; check the field before converting.
    6. The mobile report (event.type "device_updates") does not follow the
       naming or typing conventions of the others. Its parameter keys are
       UPPER_SNAKE_CASE (DEVICE_ID, OS_VERSION) where every other report uses
       lower_snake_case, and its event.name values are uppercase
       (DEVICE_SYNC_EVENT) where the others are lowercase. Its Booleans are
       the STRINGS "true"/"false", and — worse — a string-valued parameter
       that has no value arrives as the JSON Boolean false rather than being
       omitted (SERIAL_NUMBER: false, IOS_VENDOR_ID: false in the collected
       sample). Guard those with `tostring(...) !in ("", "false", "true")`
       before treating them as identifiers.
fields:

  # ==========================================
  # CORE / INGEST
  # ==========================================
  - name: timestamp
    type: DateTime
    description: "Event timestamp (UTC), normalized to epoch milliseconds, converted from id.time (when Google recorded the activity). Primary time column for range filters (e.g. where timestamp > ago(1d))."
    applicableEventTypes: ["All"]

  - name: size
    type: Integer
    description: "Internal record size in bytes, used for ingestion accounting."
    applicableEventTypes: ["All"]

  # ==========================================
  # ENRICHMENT (Added by Ingext)
  # ==========================================
  - name: _behaviors
    type: DynamicArray
    description: "A list of behavior rule names that this event triggered. Each element is a string. Use mv-expand to flatten before grouping, e.g. `mv-expand _behaviors | summarize count() by Behavior = tostring(_behaviors)`."
    applicableEventTypes: ["All"]

  - name: _ip.city
    type: String
    description: "GeoIP resolved city for ipAddress, attached by the correlation engine. Present only on records that carry ipAddress — server-side Drive and Calendar activity has neither."
    applicableEventTypes: ["login", "auth", "access", "acl_change", "notification"]
    sampleValues: ["Example City"]

  - name: _ip.country
    type: String
    description: "GeoIP resolved country for ipAddress."
    applicableEventTypes: ["login", "auth", "access", "acl_change", "notification"]
    sampleValues: ["United States"]

  - name: _ip.countryCode
    type: String
    description: "Two-letter ISO country code for ipAddress. The stable field to group on for impossible-travel and unexpected-country logic; prefer it over _ip.country."
    applicableEventTypes: ["login", "auth", "access", "acl_change", "notification"]
    sampleValues: ["US"]

  - name: _ip.isp
    type: String
    description: "Internet Service Provider owning ipAddress. Hosting/VPN provider names here on a login event are a stronger anomaly signal than the country alone."
    applicableEventTypes: ["login", "auth", "access", "acl_change", "notification"]
    sampleValues: ["Example ISP"]

  - name: _ip.org
    type: String
    description: "Organization owning the ipAddress ASN."
    applicableEventTypes: ["login", "auth", "access", "acl_change", "notification"]
    sampleValues: ["Example Hosting"]

  - name: _ip.latitude
    type: Float
    description: "GeoIP latitude of ipAddress."
    applicableEventTypes: ["login", "auth", "access", "acl_change", "notification"]

  - name: _ip.longitude
    type: Float
    description: "GeoIP longitude of ipAddress."
    applicableEventTypes: ["login", "auth", "access", "acl_change", "notification"]

  # ==========================================
  # ENVELOPE (present on every record)
  # ==========================================
  - name: kind
    type: String
    description: "Resource type string returned by the Reports API; always admin#reports#activity for this data type. Not useful as a filter."
    sampleValues: ["admin#reports#activity"]
    applicableEventTypes: ["All"]

  - name: etag
    type: String
    description: "Entity tag (version identifier) of the activity as returned by the API, in the form \"<report-etag>/<record-etag>\". The leading half is shared by every record from the same report page, so it identifies the collection batch rather than the event — use id.uniqueQualifier to identify an activity."
    applicableEventTypes: ["All"]

  - name: ipAddress
    type: String
    description: >-
      The IP address the action was performed from — the user's client address
      for interactive activity, or the address of the mobile/desktop client for
      API activity. ABSENT (not empty) whenever Google attributes the action to
      its own infrastructure: add-on-generated Drive events, background sharing
      recalculation, and many Calendar records. Always coalesce or
      isnotempty()-guard rather than joining on it blindly.
    sampleValues: ["192.0.2.10"]
    applicableEventTypes: ["login", "auth", "access", "acl_change", "notification", "event_change"]

  - name: ownerDomain
    type: String
    description: "The domain that owns the Admin console or Drive/Calendar item the action affected. Populated for the calendar (and admin/drive document) reports; absent on login and token records. Differs from the actor's domain when a document owned by one domain is touched by another."
    sampleValues: ["contoso.com"]
    applicableEventTypes: ["event_change", "notification", "access", "acl_change"]

  # ==========================================
  # RECORD IDENTITY (id.*)
  # ==========================================
  - name: id.time
    type: DateTime
    description: "When the activity occurred (UTC, millisecond resolution, ISO 8601 with a trailing Z). Source of the 'timestamp' column — filter on timestamp, and use id.time only when you need the original string."
    sampleValues: ["2026-08-04T18:09:24.574Z"]
    applicableEventTypes: ["All"]

  - name: id.uniqueQualifier
    type: String
    description: "Unique qualifier for the activity, unique within (id.time, id.applicationName, id.customerId) — not globally, so key on the combination when you need a stable per-event identity. A signed 64-bit integer delivered as a STRING and frequently negative, so quote it in comparisons and use tostring() when grouping."
    sampleValues: ["1000000000000000001", "-1000000000000000002"]
    applicableEventTypes: ["All"]

  - name: id.applicationName
    type: String
    description: >-
      The Reports API application (report) the record came from — the coarse
      discriminator for the whole schema, analogous to Office365 'Workload'.
      Pin it before filtering on any event.parameters key. Observed in the
      collected samples: login (sign-in/sign-out), token (third-party OAuth),
      drive (Drive/Shared drives), calendar, mobile (Endpoint Management —
      despite the name it covers laptops and desktops as well as phones).
      Other reports Google can deliver through the same endpoint are listed in
      the APPLICATION / EVENT CATALOGUE at the end of this file.
    sampleValues: ["login", "token", "drive", "calendar", "mobile", "admin", "groups", "saml", "user_accounts"]
    applicableEventTypes: ["All"]

  - name: id.customerId
    type: String
    description: "Immutable ID of the Google Workspace customer (account) the activity belongs to. Same value as gsuiteUser.customerId / gsuiteGroup, and the field to split on in a multi-tenant lake."
    sampleValues: ["C00000000"]
    applicableEventTypes: ["All"]

  # ==========================================
  # ACTOR (actor.*)
  # ==========================================
  - name: actor.email
    type: String
    description: "Primary email address of the user who performed the action. The main pivot for user-centric investigation and the join key to GSuiteResources gsuiteUser.primaryEmail. Absent when the actor is an API key or an unauthenticated/system caller — check actor.callerType before assuming a user."
    sampleValues: ["adele.vance@contoso.com", "sam.cole@contoso.com"]
    applicableEventTypes: ["All"]

  - name: actor.profileId
    type: String
    description: "The unique Google directory ID of the actor (numeric string, stable across email renames). Joins to gsuiteUser.id. Prefer it over actor.email when tracking one identity through a rename; note it is absent for non-user callers and is the literal string of a 21-digit number, not an int."
    sampleValues: ["100000000000000000001"]
    applicableEventTypes: ["All"]

  - name: actor.callerType
    type: String
    description: >-
      What kind of caller performed the action: USER for a human/end-user
      action, APPLICATION for an OAuth application acting on behalf of the
      account, KEY for an API console key. Present only on some reports —
      calendar and mobile carry it in the collected samples while login, token
      and drive do not — so treat a missing value as 'unspecified user action',
      not as a non-user caller. On device_updates records it says USER even
      though the sync was performed by the device rather than by a person; the
      actor there is the device's enrolled user, not someone at a keyboard.
    sampleValues: ["USER", "APPLICATION", "KEY"]
    applicableEventTypes: ["event_change", "notification", "device_updates"]

  - name: actor.key
    type: String
    description: "Present instead of actor.email/profileId when actor.callerType is KEY: the consumer key of the requestor for OAuth 1.0LEG / API-key activity. Not present in the collected samples; documented from the Reports API because it is the reason an actor.email filter can silently drop automated activity."
    applicableEventTypes: ["All"]

  # ==========================================
  # EVENT CLASSIFICATION (event.*)
  # ==========================================
  - name: event.type
    type: String
    description: >-
      The activity category within the report — the fine discriminator that
      selects which event.parameters keys exist. Seven values appear in the
      collected samples: login and auth (from the login/token reports),
      access and acl_change (drive), event_change and notification (calendar),
      device_updates (mobile). Always pair it with id.applicationName:
      'access' means a Drive document access here, but the admin report uses
      its own type vocabulary.
    sampleValues: ["login", "auth", "access", "acl_change", "event_change", "notification", "device_updates"]
    applicableEventTypes: ["All"]

  - name: event.name
    type: String
    description: >-
      The specific action taken, within event.type. This is what you report to
      a human and what a detection pins. Observed: login_success, logout
      (type login); authorize, revoke (auth); view, access_url (access);
      change_user_access (acl_change); change_event (event_change);
      notification_triggered (notification); DEVICE_SYNC_EVENT
      (device_updates). Note the mobile report's names are UPPERCASE while
      every other report's are lowercase, so a case-sensitive == against a
      lowercased name will never match a device event. See the catalogue at
      the end of this file for the wider vocabulary per report.
    sampleValues: ["login_success", "login_failure", "logout", "authorize", "revoke", "view", "download", "change_user_access", "change_document_visibility", "DEVICE_SYNC_EVENT"]
    applicableEventTypes: ["All"]

  - name: event.parameters
    type: Dynamic
    description: >-
      The per-activity parameter bag, flattened by Ingext from the API's
      {name, value} array into a keyed object. Keys are snake_case and depend
      entirely on (id.applicationName, event.type, event.name); the sections
      below document the ones observed. To discover the keys actually present
      in your data for an event type, run
      `where event.type == "acl_change" | project bag_keys(event.parameters)`
      or `summarize count() by Key = tostring(bag_keys(event.parameters))`.
      Values keep their JSON type — strings, real Booleans, numbers, and
      arrays for multi-valued parameters.
    applicableEventTypes: ["All"]

  # ==========================================
  # LOGIN PARAMETERS — event.type "login" (applicationName "login")
  # ==========================================
  - name: event.parameters.login_type
    type: String
    description: "How the account authenticated. google_password is a password entered at Google; saml / exchange indicate federated sign-in; unknown appears on some system-generated records. A shift from saml to google_password for a federated user is worth alerting on — it can mean SSO was bypassed."
    sampleValues: ["google_password", "saml", "exchange", "unknown"]
    applicableEventTypes: ["login"]

  - name: event.parameters.login_challenge_method
    type: DynamicArray
    description: >-
      Array of the challenge methods presented/satisfied during the sign-in, in
      order. ["password"] alone means no second factor was required for this
      sign-in; additional elements name the 2SV method used (for example
      idv_preregistered_phone, idv_any_phone, security_key, password_recovery).
      mv-expand to count method usage, or test membership with
      `array_index_of(event.parameters.login_challenge_method, "password") >= 0`.
      Compare against gsuiteUser.isEnrolledIn2Sv to find enrolled users who are
      still completing password-only sign-ins.
    sampleValues: ["password", "idv_preregistered_phone", "security_key"]
    applicableEventTypes: ["login"]

  - name: event.parameters.is_suspicious
    type: Boolean
    description: "Google's own verdict that the sign-in was suspicious (the signal behind the 'suspicious login' admin alert). A real JSON Boolean — compare with == true, not \"true\". Present on login_success/login_failure records; the cheapest high-signal filter in this whole data type."
    sampleValues: ["false", "true"]
    applicableEventTypes: ["login"]

  - name: event.parameters.login_failure_type
    type: String
    description: "Why a login_failure record failed — login_failure_invalid_password, login_failure_account_disabled, login_failure_unknown. Not present in the collected samples (which contain no failures); documented because it is the field that separates password guessing from attempts against disabled accounts."
    sampleValues: ["login_failure_invalid_password", "login_failure_account_disabled"]
    applicableEventTypes: ["login"]

  - name: event.parameters.affected_email_address
    type: String
    description: "The account the login-report record is about when it differs from the actor — used by account_disabled_* / suspicious_login records that Google raises against a user rather than by one. Not present in the collected samples; documented from the Reports API."
    applicableEventTypes: ["login"]

  # ==========================================
  # OAUTH TOKEN PARAMETERS — event.type "auth" (applicationName "token")
  # ==========================================
  - name: event.parameters.app_name
    type: String
    description: "Display name of the third-party (or Google) application the user granted or revoked access to. Human-readable but attacker-controlled for a malicious OAuth app — pin detections on client_id, and use app_name for the report."
    sampleValues: ["Example Workspace Add-on", "Google Chrome"]
    applicableEventTypes: ["auth"]

  - name: event.parameters.client_id
    type: String
    description: "OAuth 2.0 client ID of the application, in the form <project-number>-<hash>.apps.googleusercontent.com (Google's own first-party clients use a bare numeric form such as 77185425430.apps.googleusercontent.com). The stable identity of the app — group and allowlist on this, not on app_name."
    sampleValues: ["000000000000-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.apps.googleusercontent.com"]
    applicableEventTypes: ["auth"]

  - name: event.parameters.client_type
    type: String
    description: "The OAuth client class: WEB for a browser-based app, NATIVE_DESKTOP / NATIVE_ANDROID / NATIVE_IOS for installed clients, IOS / ANDROID for mobile SDK clients. NATIVE_* grants come from software running on an endpoint and are the more interesting case when hunting for consent phishing on unmanaged devices."
    sampleValues: ["WEB", "NATIVE_DESKTOP", "NATIVE_ANDROID", "NATIVE_IOS"]
    applicableEventTypes: ["auth"]

  - name: event.parameters.scope
    type: DynamicArray
    description: >-
      Array of the OAuth scope URLs granted (on authorize) or withdrawn (on
      revoke). The core of third-party-app risk assessment: mv-expand and match
      the sensitive families — .../auth/gmail.* (mailbox read/send),
      .../auth/drive (full Drive), .../auth/admin.directory.* (directory),
      .../auth/spreadsheets, .../auth/script.external_request (an Apps Script
      that can call out to the internet). Scopes ending in .readonly or
      .addons.execute are narrow; a bare .../auth/drive or .../auth/gmail.modify
      is not.
    sampleValues: ["https://www.googleapis.com/auth/drive", "https://www.googleapis.com/auth/gmail.readonly", "https://www.googleapis.com/auth/userinfo.email"]
    applicableEventTypes: ["auth"]

  - name: event.parameters.scope_data
    type: Boolean
    description: "Whether Google attached the expanded per-scope product/description metadata to this record. false in the collected samples; when true, additional scope_data_* keys appear alongside it. Not a security signal — do not filter on it."
    sampleValues: ["false", "true"]
    applicableEventTypes: ["auth"]

  - name: event.parameters.api_name
    type: String
    description: "For token-report 'request' events (event.name == \"request\"), the Google API the token was used against (e.g. drive, gmail, admin). Not present on authorize/revoke and not in the collected samples; documented because it is how you see what an already-consented app is actually doing."
    sampleValues: ["drive", "gmail", "calendar"]
    applicableEventTypes: ["auth"]

  - name: event.parameters.method_name
    type: String
    description: "For token-report 'request' events, the specific API method invoked with the token (e.g. drive.files.list). Pairs with api_name."
    sampleValues: ["drive.files.list", "gmail.users.messages.get"]
    applicableEventTypes: ["auth"]

  # ==========================================
  # DRIVE DOCUMENT PARAMETERS — event.type "access" and "acl_change"
  # (applicationName "drive"; these keys are shared by both types)
  # ==========================================
  - name: event.parameters.doc_id
    type: String
    description: "The Drive file/folder ID the action touched. Stable identity of the document — group on it, not on doc_title, which users rename. Absent on access_url records, which describe a URL fetch rather than a document."
    sampleValues: ["10000000000000000000000000000001"]
    applicableEventTypes: ["access", "acl_change"]

  - name: event.parameters.doc_title
    type: String
    description: "The document's title at the time of the action, including its extension for uploaded files. Free text — match with contains/has for keyword hunting (invoice, password, payroll), never with == in a detection."
    sampleValues: ["Q3 Vendor Invoice.pdf", "Project Plan Draft"]
    applicableEventTypes: ["access", "acl_change"]

  - name: event.parameters.doc_type
    type: String
    description: "The kind of Drive item: native Google types (document, spreadsheet, presentation, form, folder, drawing, script) or the uploaded file's type (pdf, msexcel, msword, image, video, binary_file, unknown)."
    sampleValues: ["pdf", "document", "spreadsheet", "folder", "binary_file"]
    applicableEventTypes: ["access", "acl_change"]

  - name: event.parameters.owner
    type: String
    description: "Email address of the document's owner. Compare with actor.email to separate a user acting on their own files from access to someone else's; compare its domain with the actor's to find cross-domain access."
    sampleValues: ["alex.wilber@contoso.com"]
    applicableEventTypes: ["access", "acl_change"]

  - name: event.parameters.owner_is_shared_drive
    type: Boolean
    description: "Whether the item lives in a shared drive rather than being owned by an individual. Shared-drive items have no personal owner, so 'owner' carries the organizer/creator instead — read this flag before drawing conclusions from 'owner'."
    sampleValues: ["false", "true"]
    applicableEventTypes: ["access", "acl_change"]

  - name: event.parameters.owner_is_team_drive
    type: Boolean
    description: "Legacy duplicate of owner_is_shared_drive kept for backwards compatibility (Team Drives were renamed shared drives). Same value; use owner_is_shared_drive in new queries."
    sampleValues: ["false", "true"]
    applicableEventTypes: ["access", "acl_change"]

  - name: event.parameters.visibility
    type: String
    description: >-
      The document's sharing state AFTER the action. The exposure ladder, least
      to most exposed: private, shared_internally (named people in the domain),
      people_within_domain_with_link, people_with_link (anyone with the link,
      outside the domain), public_on_the_web, shared_externally. Anything past
      people_within_domain_with_link means data left the organization's control.
    sampleValues: ["private", "shared_internally", "people_within_domain_with_link", "people_with_link", "public_on_the_web", "shared_externally"]
    applicableEventTypes: ["access", "acl_change"]

  - name: event.parameters.is_encrypted
    type: Boolean
    description: "Whether the item is protected by client-side encryption (Workspace CSE). true means Google (and DLP) cannot read the content."
    sampleValues: ["false", "true"]
    applicableEventTypes: ["access", "acl_change"]

  - name: event.parameters.primary_event
    type: Boolean
    description: >-
      Whether this record is the primary record of the user action. Drive emits
      one primary record plus secondary records for the side effects (each
      additional ACL entry, each item in a bulk operation, the parent folder of
      a moved file). ALWAYS filter primary_event == true when counting actions
      or building a per-user timeline; leave it unfiltered only when you
      specifically want the full ACL fan-out. Note the acl_change sample in
      eventSamples is a secondary record (false) — those are the majority of
      the acl_change volume.
    sampleValues: ["true", "false"]
    applicableEventTypes: ["access", "acl_change"]

  - name: event.parameters.billable
    type: Boolean
    description: "Whether the action counted toward the account's billable Drive usage. An accounting flag, not a security one — it correlates loosely with 'a real user touched a real document', but do not build detections on it."
    sampleValues: ["true", "false"]
    applicableEventTypes: ["access", "acl_change"]

  - name: event.parameters.actor_is_collaborator_account
    type: Boolean
    description: "Whether the actor used a collaborator (visitor) account — an external identity invited to a document without a Workspace license. true on activity from outside the directory, so it never matches a gsuiteUser record."
    sampleValues: ["false", "true"]
    applicableEventTypes: ["access", "acl_change"]

  - name: event.parameters.originating_app_id
    type: String
    description: "Numeric project ID (as a string) of the Drive/Apps Script/Marketplace application that performed the action, when the action came through an app rather than the Drive UI. Its presence together with a missing ipAddress is the signature of automated, non-interactive activity; join it against the client_id project number seen in auth events to link a consented app to what it then did."
    sampleValues: ["000000000001"]
    applicableEventTypes: ["access", "acl_change"]

  # ==========================================
  # DRIVE ACCESS PARAMETERS — event.type "access" only
  # ==========================================
  - name: event.parameters.accessed_url
    type: DynamicArray
    description: "Array holding the URL that was fetched, on access_url records (a Drive-connected app or add-on retrieving an external resource on the user's behalf). There is no doc_id on these; mv-expand or take element [0], and parse the host with parse_url() to profile the external endpoints Workspace apps are calling."
    sampleValues: ["https://analytics.example.com/api/google/data/connector/000000000000000000000001"]
    applicableEventTypes: ["access"]

  # ==========================================
  # DRIVE ACL PARAMETERS — event.type "acl_change" only
  # ==========================================
  - name: event.parameters.target_user
    type: String
    description: "The user (or group) whose access changed on a change_user_access record. Its domain vs the actor's is the external-sharing test; the literal value can also be a group address or, for link sharing, absent."
    sampleValues: ["sam.cole@contoso.com"]
    applicableEventTypes: ["acl_change"]

  - name: event.parameters.new_value
    type: DynamicArray
    description: "Array holding the access role AFTER the change: owner, writer, commenter, reader, none (removed), or organizer/fileOrganizer on shared drives. Single-element in practice — read it as tostring(event.parameters.new_value[0]) or mv-expand. A change to writer/owner for an external target_user is the escalation case."
    sampleValues: ["owner", "writer", "commenter", "reader", "none"]
    applicableEventTypes: ["acl_change"]

  - name: event.parameters.old_value
    type: DynamicArray
    description: "Array holding the access role BEFORE the change, same vocabulary as new_value. old_value == [\"none\"] means access was newly granted; new_value == [\"none\"] means it was revoked."
    sampleValues: ["none", "reader", "writer"]
    applicableEventTypes: ["acl_change"]

  - name: event.parameters.old_visibility
    type: String
    description: "The document's sharing state BEFORE the change, same vocabulary as visibility, plus the literal \"unknown\" when Google did not record a prior state (common on the record that creates a document). Pair with visibility to describe the transition."
    sampleValues: ["unknown", "private", "shared_internally", "people_with_link"]
    applicableEventTypes: ["acl_change"]

  - name: event.parameters.visibility_change
    type: String
    description: "Direction of the exposure change: external (the item became reachable from outside the domain), internal, or none (the ACL changed without changing exposure). `visibility_change == \"external\"` is the single highest-value filter for Drive data-exfiltration hunting."
    sampleValues: ["none", "external", "internal"]
    applicableEventTypes: ["acl_change"]

  # ==========================================
  # CALENDAR EVENT PARAMETERS — event.type "event_change"
  # (applicationName "calendar")
  # ==========================================
  - name: event.parameters.calendar_id
    type: String
    description: "The calendar the change was made on — a user's primary email for a personal calendar, or a long @group.calendar.google.com / @resource.calendar.google.com address for a secondary or room calendar. Compare with organizer_calendar_id to spot changes made on a calendar the actor does not own (delegated access)."
    sampleValues: ["sam.cole@contoso.com"]
    applicableEventTypes: ["event_change", "notification"]

  - name: event.parameters.organizer_calendar_id
    type: String
    description: "The calendar that owns/organizes the event. Differs from calendar_id when the record describes a copy of the event on an attendee's calendar."
    sampleValues: ["sam.cole@contoso.com"]
    applicableEventTypes: ["event_change"]

  - name: event.parameters.event_id
    type: String
    description: "Google's identifier for the calendar event (a lowercase base32-like string). Joins event_change records to the notification records raised for the same meeting."
    sampleValues: ["aaaaaaaaaaaaaaaaaaaaaaaaaa"]
    applicableEventTypes: ["event_change", "notification"]

  - name: event.parameters.event_title
    type: String
    description: "The meeting title, free text and often carrying trailing whitespace as typed. Use contains/has, not ==."
    sampleValues: ["Weekly Team Review"]
    applicableEventTypes: ["event_change"]

  - name: event.parameters.calendar_event_type
    type: String
    description: "The kind of calendar entry: default meeting, or one of Google's special types — outOfOffice, focusTime, workingLocation, birthday, fromGmail."
    sampleValues: ["default", "outOfOffice", "focusTime", "workingLocation"]
    applicableEventTypes: ["event_change"]

  - name: event.parameters.start_time
    type: Integer
    description: >-
      Scheduled start of the meeting, in SECONDS SINCE 0001-01-01T00:00:00 UTC —
      Google's internal epoch, not Unix. Passing it to unixtime_seconds_todatetime()
      yields a year-4000 nonsense date. Convert with
      `datetime(0001-01-01) + 1s * tolong(event.parameters.start_time)`, or
      subtract 62135596800 first to get Unix seconds. Example: 63921625200 is
      2026-08-06T15:00:00Z.
    sampleValues: ["63921625200"]
    applicableEventTypes: ["event_change"]

  - name: event.parameters.end_time
    type: Integer
    description: "Scheduled end of the meeting, in the same 0001-01-01 epoch as start_time. Subtracting the two directly gives the duration in seconds, since the offset cancels."
    sampleValues: ["63921628800"]
    applicableEventTypes: ["event_change"]

  - name: event.parameters.recurring
    type: String
    description: "Whether the event is part of a recurring series — the STRING \"yes\"/\"no\", not a Boolean. Note it disagrees in type with recurrence_rule, which is a real Boolean; that inconsistency is Google's, not the collector's."
    sampleValues: ["no", "yes"]
    applicableEventTypes: ["event_change"]

  - name: event.parameters.recurrence_rule
    type: Boolean
    description: "Whether this change altered the recurrence rule of the series (a real JSON Boolean). Distinct from 'recurring', which says whether the event recurs at all."
    sampleValues: ["false", "true"]
    applicableEventTypes: ["event_change"]

  - name: event.parameters.client_side_encrypted
    type: String
    description: "Whether the event is protected by client-side encryption — again the STRING \"yes\"/\"no\", not a Boolean."
    sampleValues: ["no", "yes"]
    applicableEventTypes: ["event_change"]

  - name: event.parameters.target_calendar_id
    type: String
    description: "On sharing/ACL changes in the calendar report (change_calendar_acls and friends), the calendar whose sharing was modified. Not present in the collected samples; documented because calendar over-sharing to 'anyone' is the calendar-report analogue of Drive external sharing."
    applicableEventTypes: ["event_change"]

  - name: event.parameters.user_agent
    type: String
    description: "User agent of the client that made the calendar change, when Google recorded one. Present on the notification records in the collected samples; may also appear on event_change."
    applicableEventTypes: ["event_change", "notification"]

  # ==========================================
  # CALENDAR NOTIFICATION PARAMETERS — event.type "notification"
  # ==========================================
  - name: event.parameters.notification_type
    type: String
    description: "Why the notification fired: new_event, event_changed, event_cancelled, event_response, daily_agenda, reminder. Useful for reconstructing who was told about a meeting; low security value on its own."
    sampleValues: ["new_event", "event_changed", "event_cancelled", "daily_agenda"]
    applicableEventTypes: ["notification"]

  - name: event.parameters.notification_method
    type: String
    description: "Channel the notification was delivered over — email, sms, or popup."
    sampleValues: ["email", "sms", "popup"]
    applicableEventTypes: ["notification"]

  - name: event.parameters.recipient_email
    type: String
    description: "Address the notification was sent to. The one genuinely useful field here: an external recipient_email on a calendar notification shows an internal meeting (and its title) being disclosed outside the domain."
    sampleValues: ["megan.bowen@contoso.com"]
    applicableEventTypes: ["notification"]

  - name: event.parameters.notification_message_id
    type: String
    description: "RFC 5322 Message-ID of the notification mail, in the form <calendar-<uuid>@google.com>. Joins to the corresponding Gmail/message log if one is collected."
    sampleValues: ["<calendar-00000000-0000-0000-0000-000000000001@google.com>"]
    applicableEventTypes: ["notification"]

  # ==========================================
  # ENDPOINT / DEVICE PARAMETERS — event.type "device_updates"
  # (applicationName "mobile")
  #
  # NOTE the naming break: every key in this section is UPPER_SNAKE_CASE,
  # unlike the lower_snake_case used by every other report, and the Booleans
  # are strings. This report is Google Workspace Endpoint Management, and
  # despite the report name it covers Windows/macOS/Linux endpoints as well as
  # phones — the collected sample is a Windows VM.
  # ==========================================
  - name: event.parameters.DEVICE_ID
    type: String
    description: "Stable identifier of the enrolled device (a GUID for Windows/advanced-management endpoints; on mobile it can be an Android device ID or an iOS UDID). The key to group a device's sync history on; pairs with USER_EMAIL to see one device across users."
    sampleValues: ["00000000-0000-0000-0000-000000000001"]
    applicableEventTypes: ["device_updates"]

  - name: event.parameters.RESOURCE_ID
    type: String
    description: "The Directory API mobiledevices resource ID for this device — a long opaque base64-like string. Use it to look the device up through the Admin SDK; it is not human-readable and should not be grouped on in reports (DEVICE_ID is the readable key)."
    applicableEventTypes: ["device_updates"]

  - name: event.parameters.USER_EMAIL
    type: String
    description: "Email address of the user the device is enrolled to. Normally equal to actor.email on these records; when they differ the device changed hands. Joins to gsuiteUser.primaryEmail."
    sampleValues: ["sam.cole@contoso.com"]
    applicableEventTypes: ["device_updates"]

  - name: event.parameters.DEVICE_TYPE
    type: String
    description: "Platform family of the endpoint: WINDOWS, ANDROID, IOS, MAC, LINUX, CHROME_OS. The first thing to split on, because which posture flags are meaningful depends on it (DEVICE_IS_NOT_ENCRYPTED is a real finding on WINDOWS, near-universal noise on modern IOS)."
    sampleValues: ["WINDOWS", "ANDROID", "IOS", "MAC"]
    applicableEventTypes: ["device_updates"]

  - name: event.parameters.DEVICE_MODEL
    type: String
    description: "Hardware model string as reported by the device. \"Virtual Machine\" identifies a VM rather than physical hardware, which is worth separating out of endpoint-posture reporting."
    sampleValues: ["Virtual Machine"]
    applicableEventTypes: ["device_updates"]

  - name: event.parameters.OS_VERSION
    type: String
    description: "Full OS version string, vendor-formatted and not comparable across platforms (\"Windows 10.0.26200.8328\" vs an Android or iOS version). Do not sort or range-compare it as text; use DEVICE_OS_IS_OUTDATED for the verdict and parse OS_VERSION only within a single DEVICE_TYPE."
    sampleValues: ["Windows 10.0.26200.8328"]
    applicableEventTypes: ["device_updates"]

  - name: event.parameters.DEVICE_IS_NOT_ENCRYPTED
    type: String
    description: >-
      Whether disk encryption is MISSING — note the negative polarity and the
      string typing. The STRING "true" means the device is NOT encrypted (the
      finding); "false" means it is encrypted (healthy). Filter
      `tostring(event.parameters.DEVICE_IS_NOT_ENCRYPTED) == "true"` to list
      unencrypted endpoints; tobool() also works on these strings, but comparing
      to an unquoted true will not.
    sampleValues: ["true", "false"]
    applicableEventTypes: ["device_updates"]

  - name: event.parameters.DEVICE_IS_MISSING_SCREENLOCK
    type: String
    description: "Whether the device has no screen lock configured — same negative polarity and string typing as DEVICE_IS_NOT_ENCRYPTED. \"true\" is the finding. An unlocked, unencrypted device is the pair that matters for a lost-laptop scenario."
    sampleValues: ["false", "true"]
    applicableEventTypes: ["device_updates"]

  - name: event.parameters.DEVICE_OS_IS_OUTDATED
    type: String
    description: "Whether Google considers the device's OS build out of date, as the string \"true\"/\"false\". \"true\" is the finding. This is Google's own verdict against its version baseline — it needs no OS_VERSION parsing and is the field to build patch-compliance reporting on."
    sampleValues: ["true", "false"]
    applicableEventTypes: ["device_updates"]

  - name: event.parameters.LAST_SYNC_AUDIT_DATE
    type: Integer
    description: >-
      When the device last synced with Workspace, in UNIX MILLISECONDS — a
      different convention from the Calendar report's 0001-01-01 seconds, so do
      not reuse that conversion here. Convert with
      `unixtime_milliseconds_todatetime(tolong(event.parameters.LAST_SYNC_AUDIT_DATE))`.
      On DEVICE_SYNC_EVENT records it normally equals id.time to the
      millisecond (the record IS the sync), so it becomes interesting only when
      it lags: a stale value means the posture flags on the record describe an
      old state.
    sampleValues: ["1785872529159"]
    applicableEventTypes: ["device_updates"]

  - name: event.parameters.SERIAL_NUMBER
    type: String
    description: >-
      Hardware serial number of the device — the field to join against an asset
      inventory. TYPING TRAP: when the device does not report one, this arrives
      as the JSON Boolean false rather than being omitted or set to an empty
      string (as in the collected sample). Guard it before use:
      `where tostring(event.parameters.SERIAL_NUMBER) !in ("", "false", "true")`.
    applicableEventTypes: ["device_updates"]

  - name: event.parameters.IOS_VENDOR_ID
    type: String
    description: "Apple identifierForVendor for iOS devices. Same typing trap as SERIAL_NUMBER — the JSON Boolean false on every non-iOS device (and on iOS devices that did not report it), never null. Only meaningful where DEVICE_TYPE == \"IOS\"."
    applicableEventTypes: ["device_updates"]

# ==========================================
# APPLICATION / EVENT CATALOGUE
# ==========================================
# id.applicationName selects the report; event.type the category within it;
# event.name the action. The five reports below appear in the collected
# samples; the rest are delivered through the same activities.list endpoint
# and follow the identical envelope, so a query written against the envelope
# keeps working when a new report is enabled.
#
# login  — sign-in activity (event.type: login)
#   login_success              Successful sign-in
#   login_failure              Failed sign-in (see login_failure_type)
#   login_verification         A 2SV challenge was presented
#   logout                     Sign-out
#   login_challenge            An identity challenge was issued
#   suspicious_login           Google flagged the sign-in as suspicious
#   suspicious_login_less_secure_app / suspicious_programmatic_login
#   account_disabled_password_leak     Account disabled after a leaked password
#   account_disabled_spamming_through_relay / account_disabled_hijacked
#   gov_attack_warning         Government-backed attack warning
#
# token  — third-party OAuth application activity (event.type: auth)
#   authorize                  User granted scopes to an application
#   revoke                     Access to an application was revoked
#   request                    An API call was made with an issued token
#                              (carries api_name / method_name)
#   activity                   Aggregate application activity
#
# drive  — Drive and shared-drive activity
#   event.type access:      view, edit, download, print, preview, upload,
#                           create, rename, move, copy, trash, untrash,
#                           delete, add_to_folder, remove_from_folder,
#                           access_url (external URL fetched by an add-on)
#   event.type acl_change:  change_user_access, change_document_visibility,
#                           change_document_access_scope,
#                           change_acl_editors, shared_drive_membership_change,
#                           shared_drive_settings_change, sheets_import_range
#
# calendar  — calendar and resource activity
#   event.type event_change:  create_event, change_event, delete_event,
#                             change_event_guest_response,
#                             change_event_guest_invite
#   event.type calendar_change / calendar_settings:
#                             change_calendar_acls, change_calendar_description,
#                             create_calendar, delete_calendar
#   event.type notification:  notification_triggered
#
# mobile  — Endpoint Management, all platforms (event.type: device_updates)
#   Names here are UPPERCASE, unlike every other report:
#   DEVICE_SYNC_EVENT          Device synced; carries the posture flags
#   DEVICE_REGISTER_UNREGISTER_EVENT   Device enrolled / removed
#   DEVICE_COMPROMISED_EVENT   Root/jailbreak detected
#   DEVICE_SETTINGS_UPDATE_EVENT / DEVICE_OS_UPDATE_EVENT
#   DEVICE_ACCOUNT_WIPE_EVENT / DEVICE_WIPE_EVENT   Remote wipe issued
#   SUSPICIOUS_ACTIVITY_EVENT  Endpoint Management flagged the device
#   (only DEVICE_SYNC_EVENT appears in the collected samples; the others are
#   documented from the Reports API — verify their parameter keys against
#   live data with bag_keys() before relying on them)
#
# Other reports the same endpoint can deliver (envelope identical, parameters
# not documented here because no samples were collected):
#   admin            Admin console changes (users, OUs, roles, security
#                    settings) — the highest-value report for privilege abuse
#   user_accounts    End-user self-service changes (2SV enrollment, recovery
#                    info, password changes)
#   groups / groups_enterprise   Group creation, membership and settings
#   saml             SAML SSO sign-in successes and failures
#   chat / meet      Chat and Meet activity
#   gcp              Google Cloud Platform events surfaced into Workspace
#   rules            Admin alert / DLP rule triggers
#   context_aware_access         Context-Aware Access allow/deny decisions
#   chrome           Chrome browser and ChromeOS device events
#   access_transparency          Google-staff access to customer data
