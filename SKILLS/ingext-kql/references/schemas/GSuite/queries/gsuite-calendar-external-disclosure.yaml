  2026-08-03T09:02:44.512Z  sam.cole@contoso.com  advisor@example.net           example.net          event_changed     email   Q3 Board Prep         2026-08-05T13:00:00Z  2026-08-05T14:30:00Z  yes        sam.cole@contoso.com  sam.cole@contoso.com  192.0.2.10  US
