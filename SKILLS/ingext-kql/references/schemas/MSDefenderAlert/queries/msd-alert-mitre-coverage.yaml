description: >-
  MITRE ATT&CK coverage of the Defender alert stream over 30 days: which
  techniques are actually firing, how many alerts and distinct detections back each
  one, which products contribute them, and how many incidents they touch.
  Sub-techniques (T####.###) are rolled up to their parent technique while the full
  list is kept alongside. Alerts with an empty mitreTechniques array — Entra ID
  Protection, Defender for Cloud Apps and Insider Risk generally ship none — are
  deliberately mapped to a "(none)" bucket instead of being dropped by mv-expand,
  so the coverage gap stays visible rather than silently shrinking the denominator.
datatype: MSDefenderAlert
kql: |
  // latest snapshot per record: the same id is re-emitted on every change, so
  // reduce to the newest lastUpdateDateTime per id before anything else
  MSDefenderAlert
  | where timestamp > ago(30d)
  | extend LastUpdate = todatetime(lastUpdateDateTime)
  | summarize arg_max(LastUpdate, *) by id
  | extend Techniques = iff(array_length(mitreTechniques) == 0, dynamic(["(none)"]), mitreTechniques)
  | mv-expand Technique = Techniques to typeof(string)
  | extend ParentTechnique = tostring(split(Technique, ".")[0])
  | summarize
      Alerts = dcount(id),
      Detections = dcount(title),
      Incidents = dcount(incidentId),
      High = dcountif(id, severity == "high"),
      Open = dcountif(id, status in ("new", "inProgress")),
      SubTechniques = make_set(Technique, 20),
      Tactics = make_set(category, 10),
      Products = make_set(productName, 10),
      LastSeen = max(timestamp)
    by ParentTechnique
  | order by Alerts desc, ParentTechnique asc
tags: [msdefender, defender-xdr, mitre, attack, coverage, reporting, security]
expected_output: |
  Techniques observed in the alert stream, sub-techniques rolled up (sanitized).

  ParentTechnique  Alerts  Detections  Incidents  High  Open  SubTechniques         Tactics                                  Products                                                        LastSeen
