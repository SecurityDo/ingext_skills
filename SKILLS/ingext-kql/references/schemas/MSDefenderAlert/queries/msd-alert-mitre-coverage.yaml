  T1078            2       2           2          0     1     ["T1078","T1078.004"]  ["PrivilegeEscalation","Persistence"]   ["Microsoft Sentinel"]                                          2026-07-29T21:45:41.436Z
  T1059            1       1           1          0     1     ["T1059.001"]         ["Execution"]                            ["Microsoft Defender for Endpoint"]                             2026-07-27T14:32:28.890Z
  T1098            1       1           1          0     1     ["T1098"]             ["Persistence"]                          ["Microsoft Sentinel"]                                          2026-07-29T21:45:41.436Z
