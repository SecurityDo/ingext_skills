description: >-
  Open Microsoft Defender XDR alert triage queue for the last 7 days. Collapses
  the repeated emissions of each alert to its current state (max
  lastUpdateDateTime per id, joined back), keeps only untriaged/in-progress alerts,
  drops the informational noise that Defender Antivirus generates for
  already-blocked malware, and rolls the evidence[] array up into the affected
  users, hosts and IPs plus a count of entities Defender itself called malicious.
  Alerts on assets tagged 'Critical asset' are flagged. Ordered by severity then
  newest first, with the portal deep link for pivoting.
datatype: MSDefenderAlert
kql: |
  // latest snapshot per record: this engine's dynamic schema does not support
  // arg_max(<col>, *), so take the max timestamp per id and join it back
  let LatestAlert =
      MSDefenderAlert
      | where timestamp > ago(7d)
      | summarize LastUpdate = max(todatetime(lastUpdateDateTime)) by AlertId = id;
  MSDefenderAlert
  | where timestamp > ago(7d)
  | join kind=inner LatestAlert on $left.id == $right.AlertId
  | where todatetime(lastUpdateDateTime) == LastUpdate
  | project-away AlertId, LastUpdate
  | where status in ("new", "inProgress")
  | where severity != "informational"
  | extend Sev = case(severity == "high", 4, severity == "medium", 3, severity == "low", 2, 1)
  | mv-apply ev = evidence on (
      summarize
          Users = make_set_if(tostring(ev.userAccount.userPrincipalName), isnotempty(tostring(ev.userAccount.userPrincipalName))),
          Hosts = make_set_if(tostring(ev.hostName), isnotempty(tostring(ev.hostName))),
          IPs = make_set_if(tostring(ev.ipAddress), isnotempty(tostring(ev.ipAddress))),
          MaliciousEntities = countif(tostring(ev.verdict) == "malicious")
    )
  | project
      timestamp,
      Sev,
      Severity = severity,
      Title = title,
      Product = productName,
      Category = category,
      Techniques = strcat_array(mitreTechniques, ", "),
      Users,
      Hosts,
      IPs,
      MaliciousEntities,
      Critical = iff(systemTags has "Critical asset", "yes", ""),
      Status = status,
      Owner = assignedTo,
      IncidentId = incidentId,
      AlertUrl = alertWebUrl
  | order by Sev desc, timestamp desc
  | project-away Sev
tags: [msdefender, defender-xdr, alerts, triage, incident-response, security]
expected_output: |
  Open alerts ranked by severity with the entities pulled out of evidence[] (sanitized).

