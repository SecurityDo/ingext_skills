description: >-
  Daily health of Duo's directory (AD) user sync, from the ad_sync_finish and
  ad_sync_failed admin events. Per day and directory: how many sync runs
  happened, how many failed outright (ad_sync_failed — typically the
  Authentication Proxy not responding, with the reason in
  descriptionFields.reason), how many finished with per-user errors, and the
  user delta. A day of failed runs means directory changes (leavers, new
  hires) are not reaching Duo; a nonzero Removed means accounts were dropped
  from Duo, which removes their MFA enrollment. Note the descriptionFields keys
  have their spaces stripped (Usersseen, Usersremoved) — the original
  "Users seen" spelling returns null.
datatype: DuoAdmin
kql: |
  DuoAdmin
  | where timestamp > ago(7d)
  | where action in ("ad_sync_finish", "ad_sync_failed")
  | extend UsersSeen = toint(descriptionFields.Usersseen),
           UsersAdded = toint(descriptionFields.Usersadded),
           UsersRemoved = toint(descriptionFields.Usersremoved),
           SyncErrors = tostring(descriptionFields.Errors),
           FailReason = tostring(descriptionFields.reason)
  | summarize Runs = count(),
              Failed = countif(action == "ad_sync_failed"),
              WithErrors = countif(isnotempty(SyncErrors)),
              MaxUsersSeen = max(UsersSeen),
              Added = sum(UsersAdded),
              Removed = sum(UsersRemoved),
              FailReasons = make_set(FailReason, 3),
              LastRun = max(timestamp)
      by Day = bin(timestamp, 1d), Directory = object
  | order by Day desc
tags: [duo, cisco, admin, directory-sync, active-directory, health, coverage]
expected_output: |
  Duo AD sync runs per day, with a day-long Authentication Proxy outage (sanitized).

  Day                   Directory  Runs  Failed  WithErrors  MaxUsersSeen  Added  Removed  FailReasons                                                   LastRun
  2026-10-26T00:00:00Z  AD Sync    41    19      0           671           0      0        ["", "The Authentication Proxy did not respond. Please ..."]  2026-10-26T23:46:09Z
  2026-10-25T00:00:00Z  AD Sync    35    35      0           null          null   null     ["The Authentication Proxy did not respond. Please ..."]      2026-10-25T23:37:02Z
  2026-10-24T00:00:00Z  AD Sync    47    0       0           671           0      0        [""]                                                          2026-10-24T23:55:54Z
