description: >-
  Numbers Duo called or texted repeatedly within one hour. Bins telephony
  events per phone number and context into 1-hour windows and keeps windows
  with four or more calls/SMS. A burst usually means a user retrying a phone
  factor that is not reaching them, a mistyped number on the account receiving
  someone else's login codes (expect phone_delete / phone_create in DuoAdmin
  for a near-identical number shortly after), or phone/SMS bombing. The record
  has no user, so attribute each number by looking it up in DuoAuthentication
  (auth_device.name is the same number in dashed form, e.g. +16165550142 ->
  616-555-0142) — see duo-telephony-by-user.
datatype: DuoTelephony
kql: |
  DuoTelephony
  | where timestamp > ago(30d)
  | summarize Messages = count(),
              Calls = countif(type == "phone"),
              Sms = countif(type == "sms"),
              Credits = sum(toint(credits)),
              FirstSeen = min(timestamp),
              LastSeen = max(timestamp)
      by bin(timestamp, 1h), phone, context
  | where Messages >= 4
  | extend DashedNumber = strcat(substring(phone, 2, 3), "-", substring(phone, 5, 3), "-", substring(phone, 8))
  | project timestamp, phone, DashedNumber, context, Messages, Calls, Sms, Credits, FirstSeen, LastSeen
  | order by Messages desc
tags: [duo, cisco, telephony, sms, phone, bombing, toll-fraud, detection]
expected_output: |
  Phone numbers contacted four or more times in an hour (sanitized).

  timestamp             phone         DashedNumber  context         Messages  Calls  Sms  Credits  FirstSeen             LastSeen
  2026-10-20T12:00:00Z  +16095550188  609-555-0188  authentication  13        6      7    19       2026-10-20T12:41:28Z  2026-10-20T12:53:30Z
  2026-10-12T14:00:00Z  +16165550142  616-555-0142  authentication  7         7      0    14       2026-10-12T14:23:17Z  2026-10-12T14:41:05Z
