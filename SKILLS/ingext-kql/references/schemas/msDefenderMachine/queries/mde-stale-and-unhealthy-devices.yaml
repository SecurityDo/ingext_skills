description: >-
  Devices whose Defender for Endpoint sensor is not reporting properly — stale
  last-seen, a non-Active health status, or not onboarded at all. The EDR-coverage
  hygiene report: every device here is one the tenant believes is protected but
  from which no current telemetry arrives. lastSeen is the last *full device
  report* (MDE sends one roughly daily and it lags the portal's own last-seen), so
  the threshold is in days, not hours.
datatype: msDefenderMachine
kql: |
  msDefenderMachine
  | where isnull(mergedIntoMachineId) and isExcluded != true
  | extend LastSeen = todatetime(lastSeen)
  | extend
      Stale        = LastSeen < ago(7d),
      Unhealthy    = healthStatus != "Active",
      NotOnboarded = onboardingStatus !~ "Onboarded"
  | where Stale or Unhealthy or NotOnboarded
  | extend Reasons = strcat_array(pack_array(
      iff(Stale, "stale", ""),
      iff(Unhealthy, strcat("health:", healthStatus), ""),
      iff(NotOnboarded, strcat("onboarding:", onboardingStatus), "")), " ")
  | project
      computerDnsName,
      id,
      LastSeen,
      StaleDays = datetime_diff('day', now(), LastSeen),
      Reasons,
      osPlatform,
      version,
      agentVersion,
      managedBy,
      rbacGroupName,
      exposureLevel,
      riskScore
  | order by LastSeen asc
tags: [microsoft, defender, mde, endpoint, hygiene, stale, sensor, coverage, security]
expected_output: |
  Devices not reporting properly, oldest first (sanitized).

