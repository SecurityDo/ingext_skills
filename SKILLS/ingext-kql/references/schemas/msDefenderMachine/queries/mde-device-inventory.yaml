description: >-
  Defender for Endpoint fleet inventory overview: device counts by OS platform,
  onboarding status and sensor health, with the exposure/risk mix and how many
  devices are stale. The starting point for any coverage question — the
  'CanBeOnboarded' rows are devices MDE discovered but that no sensor reports on,
  and the Inactive/NoSensorData rows are onboarded devices that stopped talking.
  Each device appears once (the resource key is the device id), so no dedup is
  needed.
datatype: msDefenderMachine
kql: |
  msDefenderMachine
  | where isnull(mergedIntoMachineId) and isExcluded != true
  | extend LastSeen = todatetime(lastSeen)
  | summarize
      Devices        = dcount(id),
      Stale7d        = countif(LastSeen < ago(7d)),
      HighExposure   = countif(exposureLevel == "High"),
      HighRisk       = countif(riskScore in ("High", "Medium")),
      Duplicates     = countif(isPotentialDuplication == true),
      OldestLastSeen = min(LastSeen),
      NewestLastSeen = max(LastSeen)
      by osPlatform, onboardingStatus, healthStatus
  | order by Devices desc
tags: [microsoft, defender, mde, endpoint, inventory, coverage, posture, security]
expected_output: |
  Device counts by platform and sensor state (sanitized).

  osPlatform  onboardingStatus  healthStatus  Devices  Stale7d  HighExposure  HighRisk  Duplicates  OldestLastSeen        NewestLastSeen
