description: >-
  Devices ranked by the two independent Defender ratings — riskScore (active
  threat activity seen on the device) and exposureLevel (how attackable it is) —
  weighted by the business value an administrator assigned. The two ratings move
  independently, so the interesting rows are the ones scoring on both, and the
  high-value devices score first regardless. Feeds triage: take the top rows to
  MSDefenderAlert (by device name / mdeDeviceId) for what actually happened, and
  to msDefenderVulnerability for what to fix.
datatype: msDefenderMachine
kql: |
  msDefenderMachine
  | where isnull(mergedIntoMachineId) and isExcluded != true
  | where riskScore in ("Medium", "High") or exposureLevel in ("Medium", "High")
  | extend
      RiskRank     = case(riskScore == "High", 4, riskScore == "Medium", 3,
                          riskScore == "Low", 2, riskScore == "Informational", 1, 0),
      ExposureRank = case(exposureLevel == "High", 3, exposureLevel == "Medium", 2,
                          exposureLevel == "Low", 1, 0),
      ValueRank    = case(deviceValue == "High", 2, deviceValue == "Low", 0, 1)
  | extend Priority = RiskRank * 10 + ExposureRank * 3 + ValueRank
  | project
      Priority,
      computerDnsName,
      id,
      riskScore,
      exposureLevel,
      deviceValue,
      osPlatform,
      version,
      healthStatus,
      LastSeen = todatetime(lastSeen),
      rbacGroupName,
      machineTags,
      LastExternalIp = lastExternalIpAddress
  | order by Priority desc, computerDnsName asc
tags: [microsoft, defender, mde, endpoint, risk, exposure, triage, prioritization, security]
expected_output: |
  Devices carrying active risk or high exposure, highest priority first (sanitized).

