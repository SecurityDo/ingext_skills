description: >-
  One row per device combining all four Defender for Endpoint resources: sensor
  and risk state from msDefenderMachine, antivirus mode and signature currency
  from msDefenderAvHealth, misconfiguration debt from msDefenderSecureConfig and
  the vulnerability count from msDefenderVulnerability. The single-screen answer to
  "how protected is this endpoint", and the report to run before or after a
  hardening push. All four join on the same MDE device id (id / machineId /
  deviceId / DeviceId) and each holds one current snapshot per device, so no dedup
  is needed anywhere. leftouter joins throughout: a device missing from the AV or
  findings tables is itself a finding, not a row to drop.
datatype: msDefenderMachine
kql: |
  let AvState =
      msDefenderAvHealth
      | summarize
          AvMode        = any(avMode),
          SignatureOk   = any(avIsSignatureUpToDate),
          SignatureAge  = min(datetime_diff('hour', now(), todatetime(avSignatureUpdateTime))),
          LastQuickScan = max(todatetime(quickScanTime))
          by AvDeviceId = machineId;
  let ConfigDebt =
      msDefenderSecureConfig
      | where isApplicable == true and isCompliant == false
      | summarize FailedControls = count(), DebtImpact = sum(configurationImpact)
                  by CfgDeviceId = deviceId;
  let VulnLoad =
      msDefenderVulnerability
      | where isnotempty(CveId)
      | summarize
          OpenCves     = dcount(CveId),
          CriticalCves = dcountif(CveId, VulnerabilitySeverityLevel == "Critical"),
          ExploitableCves = dcountif(CveId, ExploitabilityLevel in ("ExploitIsVerified", "ExploitIsInKit"))
          by VulnDeviceId = DeviceId;
  msDefenderMachine
  | where isnull(mergedIntoMachineId) and isExcluded != true
  | join kind=leftouter AvState on $left.id == $right.AvDeviceId
  | join kind=leftouter ConfigDebt on $left.id == $right.CfgDeviceId
  | join kind=leftouter VulnLoad on $left.id == $right.VulnDeviceId
  | extend
      AvModeName = case(AvMode == "0", "Active", AvMode == "1", "Passive",
                        AvMode == "2", "Disabled", AvMode == "4", "EDRBlocked",
                        AvMode == "5", "PassiveAudit", isempty(AvMode), "no-av-report", "Other"),
      SignatureStale = SignatureOk =~ "False" or SignatureAge > 48
  | project
      computerDnsName,
      id,
      healthStatus,
      LastSeen = todatetime(lastSeen),
      riskScore,
      exposureLevel,
      deviceValue,
      AvModeName,
      SignatureStale,
      SignatureAgeHours = SignatureAge,
      LastQuickScan,
      FailedControls = coalesce(FailedControls, 0),
      DebtImpact     = coalesce(DebtImpact, 0),
      OpenCves       = coalesce(OpenCves, 0),
      CriticalCves   = coalesce(CriticalCves, 0),
      ExploitableCves = coalesce(ExploitableCves, 0),
      osPlatform, version, managedBy, rbacGroupName
  | order by ExploitableCves desc, CriticalCves desc, DebtImpact desc
tags: [microsoft, defender, mde, endpoint, posture, rollup, join, av, vulnerability, secure-configuration, security]
expected_output: |
  Full endpoint posture, one row per device (sanitized).

