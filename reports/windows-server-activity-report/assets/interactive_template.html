<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<style>
:root{--red:#B91C1C;--blu:#1D4ED8;--amb:#B45309;--grn:#15803D;--navy:#14213d;--bg:#f4f6fa;--card:#fff;--ink:#1f2937;--m:#64748b;--line:#e2e8f0;--acc:#1d4ed8}
:root[data-theme=dark]{--red:#f87171;--blu:#7aa7ff;--amb:#fbbf24;--grn:#4ade80;--navy:#9db4e0;--bg:#0f1523;--card:#182033;--ink:#e5ebf7;--m:#8b9bb8;--line:#26324b;--acc:#6ea0ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
header{background:linear-gradient(135deg,#0f1a33,#1d3461);color:#fff;padding:24px 0 16px}
.w{max-width:1180px;margin:0 auto;padding:0 20px;position:relative}
.eyebrow{letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:#9db4e0;font-weight:600}
h1{margin:4px 0 6px;font-size:26px}
header p{margin:0 0 10px;color:#cdd8ee;max-width:820px}
.chip{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:2px 11px;font-size:12px;margin:0 8px 4px 0}
#theme{position:absolute;right:20px;top:0;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:4px 10px;cursor:pointer;font:12px inherit}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
nav .w{display:flex;gap:2px}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--m);font:600 13px inherit;padding:12px 14px;cursor:pointer}
nav button.on{color:var(--acc);border-color:var(--acc)}
main{padding:18px 20px 48px;max-width:1180px;margin:0 auto}
.g{display:grid;gap:12px;margin-bottom:12px}.k4{grid-template-columns:repeat(4,1fr)}.c2{grid-template-columns:repeat(2,1fr)}
@media(max-width:800px){.k4,.c2{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.k4,.c2{grid-template-columns:1fr}}
.k{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:12px 14px}
.k[data-go]{cursor:pointer}.k[data-go]:hover{box-shadow:0 2px 10px rgba(0,0,0,.15)}
.k b{display:block;font-size:26px;color:var(--c);line-height:1.15}
.k span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--m);font-weight:600}
.k small{display:block;color:var(--m);font-size:11px}
.p{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.p h3{margin:0 0 2px;font-size:14px}.p .sub{margin:0 0 8px;color:var(--m);font-size:12px}
.warn{border-left:4px solid var(--amb)}.read{border-left:4px solid var(--acc)}
.p ul{margin:6px 0 0;padding-left:20px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--m);padding:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none;white-space:nowrap}
th.s::after{content:" \25B2"}th.s.d::after{content:" \25BC"}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.t{overflow-wrap:anywhere;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.m{color:var(--m)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
input,select,button.b{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font:inherit}
input[type=search]{min-width:160px;flex:1}input[type=number]{width:90px}
button.b{cursor:pointer}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:600;background:rgba(180,83,9,.15);color:var(--amb)}
.pill.bad{background:rgba(185,28,28,.15);color:var(--red)}.pill.ok{background:rgba(21,128,61,.15);color:var(--grn)}
.cell{position:relative;display:inline-block;width:60px;height:6px;background:var(--line);border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden}.cell i{display:block;height:100%;background:var(--c,var(--acc))}
svg.ch{width:100%;height:auto;display:block}
#tip{position:fixed;pointer-events:none;background:#0f1a33;color:#fff;font-size:12px;padding:5px 9px;border-radius:6px;display:none;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.msel{display:flex;align-items:center;gap:8px;margin:6px 0 8px;font-size:12px;color:var(--m)}
.msel select{background:var(--card);color:var(--fg,inherit);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:13px inherit;min-width:240px}
.mchips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.mchips button{background:var(--card);color:var(--m);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font:12px inherit;cursor:pointer}
.mchips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
@media print{nav,#theme,.bar{display:none}.tw{max-height:none}.pane{display:block!important}}
</style>
</head>
<body>
<header><div class="w"><button id="theme" type="button">Dark / light</button><div class="eyebrow">Windows server activity</div><h1>Windows Server Activity Report</h1>
<p>Event ingestion by host and event ID, logons and failures, privileged logons, account and group changes, services, tasks and audit-log tampering, built from the archived daily runs.</p><div id="chips"></div></div></header>
<nav><div class="w" id="tabs"></div></nav>
<main id="main"></main>
<div id="tip"></div>
<script>
var DATA = {{data}};
</script>
<script>
(function(){
var D = DATA, $ = function(s,r){return (r||document).querySelector(s)};
var tip = $("#tip");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(v){if(typeof v!=="number")return esc(v);return v%1?v.toLocaleString(undefined,{maximumFractionDigits:1}):v.toLocaleString()}
function gb(b){return b>=1e9?(b/1e9).toFixed(2)+" GB":(b/1e6).toFixed(1)+" MB"}
try{var th=localStorage.getItem("wsr-theme");if(th)document.documentElement.setAttribute("data-theme",th);else if(matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.setAttribute("data-theme","dark")}catch(e){}
$("#theme").onclick=function(){var d=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",d);try{localStorage.setItem("wsr-theme",d)}catch(e){}};

var M = D.meta, T = D.totals;
var chips = ["<span class='chip'>"+esc(M.tenant||"Tenant")+"</span>","<span class='chip'>"+esc(M.site||"Connector")+"</span>","<span class='chip'>Period "+esc(M.period)+"</span>","<span class='chip'>"+M.days_archived+" of "+M.days_expected+" days archived</span>","<span class='chip'>Counts, not a determination</span>"];
if(!M.actors)chips.push("<span class='chip'>User and IP lists omitted</span>");
$("#chips").innerHTML=chips.join("");

function csvCell(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function download(name,rows){var b=new Blob([rows.map(function(r){return r.map(csvCell).join(",")}).join("\n")],{type:"text/csv"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}

/* ---------- interactive table ---------- */
function mkTable(def){
  var box=document.createElement("div");box.className="p";box.dataset.tid=def.id;
  var st={q:"",min:"",sort:def.sort==null?-1:def.sort,desc:def.sort!=null||def.cols.some(function(c){return c.n}),page:50};
  var ni=def.cols.findIndex(function(c){return c.n});
  if(st.sort<0&&ni>=0)st.sort=ni;
  box.innerHTML="<h3>"+esc(def.title)+"</h3><p class='sub'>"+esc(def.sub||"")+"</p><div class='bar'><input type='search' placeholder='Search' aria-label='Search "+esc(def.title)+"'>"+
    (ni>=0?"<label class='m'>Min "+esc(def.cols[ni].l)+" <input type='number' min='0' class='mn'></label>":"")+
    "<span class='m cnt'></span><button class='b csv' type='button'>Export CSV</button></div><div class='tw'><table><thead><tr></tr></thead><tbody></tbody></table></div><div class='bar more' style='display:none'><button class='b mb' type='button'>Show more</button></div>";
  var tr=$("thead tr",box),tb=$("tbody",box);
  def.cols.forEach(function(c,i){var h=document.createElement("th");h.textContent=c.l;if(c.n)h.className="r";h.onclick=function(){if(st.sort===i)st.desc=!st.desc;else{st.sort=i;st.desc=!!c.n}draw()};tr.appendChild(h)});
  function view(){
    var q=st.q.toLowerCase(),mn=st.min===""?null:Number(st.min);
    var rows=def.rows.filter(function(r){
      if(q&&!r.some(function(v){return String(v).toLowerCase().indexOf(q)>=0}))return false;
      if(mn!=null&&ni>=0&&!(r[ni]>=mn))return false;return true});
    if(st.sort>=0){var k=st.sort,s=st.desc?-1:1;rows=rows.slice().sort(function(a,b){var x=a[k],y=b[k];if(typeof x==="number"&&typeof y==="number")return (x-y)*s;return String(x).localeCompare(String(y))*s})}
    return rows}
  function draw(){
    var rows=view(),mx=1;if(ni>=0)rows.forEach(function(r){if(r[ni]>mx)mx=r[ni]});
    var show=rows.slice(0,st.page);
    tb.innerHTML=show.length?show.map(function(r){return "<tr>"+r.map(function(v,i){var c=def.cols[i];
      if(c.n)return "<td class='r'>"+fmt(v)+(i===ni?"<span class='cell' style='--c:"+def.color+"'><i style='width:"+Math.round(100*v/mx)+"%'></i></span>":"")+"</td>";
      return "<td class='t'>"+esc(v)+"</td>"}).join("")+"</tr>"}).join(""):"<tr><td class='m' colspan='"+def.cols.length+"'>"+(def.rows.length?"No rows match the filter.":"None in this period.")+"</td></tr>";
    $(".cnt",box).textContent=rows.length+" of "+def.rows.length+" rows";
    Array.prototype.forEach.call(tr.children,function(h,i){h.className=(def.cols[i].n?"r ":"")+(i===st.sort?"s"+(st.desc?" d":""):"")});
    var more=$(".more",box);more.style.display=rows.length>st.page?"flex":"none";$(".mb",box).textContent="Show more ("+(rows.length-st.page)+" left)";
  }
  $("input[type=search]",box).oninput=function(e){st.q=e.target.value;st.page=50;draw()};
  var mnEl=$(".mn",box);if(mnEl)mnEl.oninput=function(e){st.min=e.target.value;st.page=50;draw()};
  $(".mb",box).onclick=function(){st.page+=200;draw()};
  $(".csv",box).onclick=function(){download((def.id||"table")+".csv",[def.cols.map(function(c){return c.l})].concat(view()))};
  draw();return box}

/* ---------- hover bar chart ---------- */
function chart(metric,color,big){
  var W=big?1100:520,H=big?220:120,L=8,B=22,days=D.days,vals=days.map(function(d){return d.gap?null:d.v[metric]});
  var mx=Math.max.apply(null,vals.filter(function(v){return v!=null}).concat([1])),bw=(W-2*L)/Math.max(days.length,1);
  var s="<svg class='ch' viewBox='0 0 "+W+" "+H+"' role='img' aria-label='"+esc(D.labels[metric])+" per day'><line x1='"+L+"' x2='"+(W-L)+"' y1='"+(H-B)+"' y2='"+(H-B)+"' stroke='var(--line)'/>";
  days.forEach(function(d,i){var x=L+i*bw,v=vals[i],tipText=d.date+": "+(v==null?"not archived (gap)":fmt(v)+" "+D.labels[metric].toLowerCase());
    if(v==null)s+="<rect x='"+(x+.5)+"' y='6' width='"+Math.max(bw-1,1)+"' height='"+(H-B-6)+"' fill='rgba(245,158,11,.18)' stroke='#f59e0b' stroke-dasharray='2 2' data-t='"+esc(tipText)+"'/>";
    else{var h=(H-B-10)*v/mx;s+="<rect class='bb' x='"+(x+.5)+"' y='"+(H-B-h)+"' width='"+Math.max(bw-1,1)+"' height='"+Math.max(h,v?1:0)+"' fill='"+color+"' data-t='"+esc(tipText)+"'/><rect x='"+x+"' y='0' width='"+bw+"' height='"+(H-B)+"' fill='transparent' data-t='"+esc(tipText)+"'/>"}});
  s+="<text x='"+L+"' y='"+(H-6)+"' font-size='10' fill='var(--m)'>"+esc(days.length?days[0].date:"")+"</text><text x='"+(W-L)+"' y='"+(H-6)+"' font-size='10' fill='var(--m)' text-anchor='end'>"+esc(days.length?days[days.length-1].date:"")+"</text><text x='"+(W-L)+"' y='10' font-size='10' fill='var(--m)' text-anchor='end'>max "+fmt(mx)+"</text></svg>";
  return s}
document.addEventListener("mousemove",function(e){var t=e.target&&e.target.getAttribute&&e.target.getAttribute("data-t");if(t){tip.textContent=t;tip.style.display="block";tip.style.left=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8)+"px";tip.style.top=(e.clientY+14)+"px"}else tip.style.display="none"});

function kpi(l,v,c,sm,go){return "<div class='k' style='--c:"+c+"'"+(go?" data-go='"+go+"'":"")+"><b>"+esc(v)+"</b><span>"+esc(l)+"</span>"+(sm?"<small>"+esc(sm)+"</small>":"")+"</div>"}
function tablesFor(tab,root){D.tables.filter(function(t){return t.tab===tab}).forEach(function(t){root.appendChild(mkTable(t))})}
function grid2(tab,root){var g=document.createElement("div");g.className="g c2";D.tables.filter(function(t){return t.tab===tab&&t.half}).forEach(function(t){g.appendChild(mkTable(t))});if(g.children.length)root.appendChild(g)}
function fullTables(tab,root){D.tables.filter(function(t){return t.tab===tab&&!t.half}).forEach(function(t){root.appendChild(mkTable(t))})}

/* ---------- panes ---------- */
var panes={};
panes.overview=function(r){
  var chg=T.accountCreated+T.accountDeleted+T.accountDisabled+T.accountEnabled+T.passwordChanges;
  var h="<div class='g k4'>"+kpi("Events",fmt(T.events),"var(--navy)",gb(T.bytes)+" ingested, "+fmt(T.hosts)+" hosts (peak day)","events")+
   kpi("User logons",fmt(T.logonsOk),"var(--grn)",fmt(T.networkLogons)+" network, "+fmt(T.rdpLogons)+" remote desktop","logons")+
   kpi("Failed logons",fmt(T.logonsFailed),T.logonsFailed?"var(--red)":"var(--grn)",fmt(T.kerberosFailures)+" Kerberos, "+fmt(T.ntlmFailures)+" NTLM failures","logons")+
   kpi("Privileged logons",fmt(T.privLogons),"var(--amb)","event 4672, user accounts","priv")+"</div>"+
   "<div class='g k4'>"+kpi("Account changes",fmt(chg),"var(--blu)",fmt(T.accountCreated)+" created, "+fmt(T.accountDeleted)+" deleted","priv")+
   kpi("Group adds",fmt(T.groupAdds),"var(--blu)",fmt(T.lockouts)+" lockouts","priv")+
   kpi("Services / tasks added",fmt(T.servicesInstalled)+" / "+fmt(T.tasksCreated),"var(--amb)","","tamper")+
   kpi("Log clears / policy changes",fmt(T.logsCleared)+" / "+fmt(T.auditPolicyChanges),T.logsCleared?"var(--red)":"var(--navy)","","tamper")+"</div>"+
   "<div class='p read'><b>Read this first.</b> Every figure comes from the daily archive of the WindowsSrv_Activity_Report scheduled report; nothing was searched live. The numbers are counts of Windows event log records, related to NIST 800-53 access, account, change and audit controls. They are not a compliance determination. Zero means no matching event on an archived day; a day that is not archived is a gap, and a scan the tenant could not run is not available.</div>";
  if(M.nodata)h+="<div class='p warn'><b>No Windows data.</b> Every scan on every archived day reports the WindowsAudit table as not available. This tenant does not collect Windows events (or the table has a different name); the counts are not zeros of activity.</div>";
  if(M.missing.length)h+="<div class='p warn'><b>Gap.</b> "+M.missing.length+" day(s) are not in the archive and are not counted as zero: "+esc(M.missing.slice(0,31).join(", "))+(M.missing.length>31?" ...":"")+".</div>";
  h+="<div class='p'><h3>Worth a look</h3><ul>"+D.highlights.map(function(x){return "<li>"+esc(x)+"</li>"}).join("")+"</ul></div>";
  h+="<div class='g c2'>"+[["events","var(--navy)"],["logonsOk","var(--grn)"],["logonsFailed","var(--red)"],["privLogons","var(--amb)"]].map(function(m){return "<div class='p'><h3>"+esc(D.labels[m[0]])+" per day</h3><p class='sub'>Hover a bar for the day. Hatched amber columns are gaps.</p>"+chart(m[0],m[1].replace("var(--navy)","#3b5a9a").replace("var(--grn)","#15803D").replace("var(--red)","#B91C1C").replace("var(--amb)","#B45309"))+"</div>"}).join("")+"</div>";
  h+="<div class='p'><h3>Trend explorer</h3><p class='sub'>Pick any counter. Hosts is the peak single day.</p><label class='msel'>Counter <select id='msel'></select></label><div id='mchart'></div></div>";
  r.innerHTML=h;
  var sel=$("#msel",r);
  sel.innerHTML=D.metrics.map(function(m){return "<option value='"+m+"'>"+esc(D.labels[m])+"</option>"}).join("");
  function ex(){$("#mchart",r).innerHTML=chart(sel.value,"#1D4ED8",true)}
  sel.onchange=ex;ex();
  Array.prototype.forEach.call(r.querySelectorAll("[data-go]"),function(k){k.onclick=function(){show(k.dataset.go)}});
};
panes.daily=function(r){r.appendChild(mkTable(D.daily_table))};
panes.events=function(r){fullTables("events",r)};
panes.logons=function(r){grid2("logons",r);fullTables("logons",r);if(!M.actors)r.insertAdjacentHTML("beforeend","<div class='p'>Account names and source addresses are omitted in this build.</div>")};
panes.priv=function(r){grid2("priv",r);fullTables("priv",r);if(!M.actors)r.insertAdjacentHTML("beforeend","<div class='p'>Account names are omitted in this build.</div>")};
panes.tamper=function(r){grid2("tamper",r);fullTables("tamper",r);if(D.capped.length)r.insertAdjacentHTML("beforeend","<div class='p m'>Lists that reached the 100-value limit on at least one day (later values are lost): "+esc(D.capped.join(", "))+".</div>")};
panes.coverage=function(r){
  var h="<div class='p'><h3>Archive coverage</h3><p class='sub'>What this report is built from, and which scans the tenant could run.</p><div class='tw'><table><tbody><tr><td>Days archived</td><td class='r'><span class='pill "+(M.missing.length?"":"ok")+"'>"+M.days_archived+" of "+M.days_expected+"</span></td></tr><tr><td>Script version(s)</td><td class='r t'>"+esc(M.hashes)+"</td></tr></tbody></table></div>";
  if(M.non_completed)h+="<p class='sub'>Non-completed runs: "+esc(M.non_completed)+"</p>";
  if(M.multi_script)h+="<p class='sub'><b>Script changed during the period.</b> Confirm the counts are defined the same way before comparing days.</p>";
  h+="</div>";r.innerHTML=h;
  tablesFor("coverage",r)};
var tabs=[["overview","Overview"],["events","Events and hosts"],["logons","Logons and failures"],["priv","Privileged and changes"],["tamper","Services and tampering"],["coverage","Coverage"],["daily","Daily counts"]];
var built={};
function show(id){tabs.forEach(function(t){var p=$("#pane-"+t[0]);if(p)p.style.display=t[0]===id?"":"none"});
  Array.prototype.forEach.call($("#tabs").children,function(b){b.className=b.dataset.tab===id?"on":""});
  if(!built[id]){built[id]=1;panes[id]($("#pane-"+id))}
  try{history.replaceState(null,"","#"+id)}catch(e){}}
$("#main").innerHTML=tabs.map(function(t){return "<div class='pane' id='pane-"+t[0]+"' style='display:none'></div>"}).join("");
$("#tabs").innerHTML=tabs.map(function(t){return "<button type='button' data-tab='"+t[0]+"'>"+t[1]+"</button>"}).join("");
$("#tabs").onclick=function(e){if(e.target.dataset&&e.target.dataset.tab)show(e.target.dataset.tab)};
var h0=(location.hash||"").slice(1);show(tabs.some(function(t){return t[0]===h0})?h0:"overview");
window.__ready=true;
})();
</script>
</body>
</html>
