<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<style>
:root{--red:#111827;--blu:#4b5563;--amb:#374151;--grn:#6b7280;--gry:#9ca3af;--bg:#f5f5f5;--card:#fff;--ink:#1f2328;--m:#6b7280;--line:#e5e5e5;--acc:#374151;--navy:#1f2328}
@media(prefers-color-scheme:dark){:root{--red:#f5f5f5;--blu:#bdbdbd;--amb:#d4d4d4;--grn:#9ca3af;--gry:#6b7280;--bg:#111111;--card:#1a1a1a;--ink:#eeeeee;--m:#9a9a9a;--line:#2b2b2b;--acc:#f5f5f5;--navy:#eeeeee}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
header{background:linear-gradient(135deg,#111827,#374151);color:#fff;padding:26px 0 18px}
.w{max-width:1180px;margin:0 auto;padding:0 20px}
.eyebrow{letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:#d4d4d4;font-weight:600}
h1{margin:4px 0 8px;font-size:26px}
.chip{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:2px 11px;font-size:12px;margin:0 8px 4px 0}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
nav .w{display:flex;gap:2px}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--m);font:600 13px inherit;padding:12px 14px;cursor:pointer}
nav button.on{color:var(--acc);border-color:var(--acc)}
main{padding:18px 20px 48px;max-width:1180px;margin:0 auto}
.g{display:grid;gap:12px}.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.c2{grid-template-columns:repeat(2,1fr)}
@media(max-width:800px){.k4,.k3,.c2{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.k4,.k3,.c2{grid-template-columns:1fr}}
.k{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:12px 14px}
.k[data-go]{cursor:pointer}.k[data-go]:hover{box-shadow:0 2px 10px rgba(0,0,0,.12)}
.k b{display:block;font-size:26px;color:var(--c);line-height:1.15}
.k span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--m);font-weight:600}
.k small{display:block;color:var(--m);font-size:11px}
.p{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px}
.p:first-child{margin-top:0}.g>.p{margin-top:0}
.p h3{margin:0 0 8px;font-size:14px}
.warn{border-left:4px solid #374151;background:rgba(180,83,9,.1)}.read{border-left:4px solid var(--acc)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--m);padding:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);cursor:pointer;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
td.w{white-space:normal;min-width:240px;overflow-wrap:anywhere}
.r{text-align:right;font-variant-numeric:tabular-nums}
.tw{max-height:600px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.m{color:var(--m)}.sm{font-size:12px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
input[type=search],select,button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
input[type=search]{min-width:220px;flex:1}
button{cursor:pointer}button:disabled{opacity:.4;cursor:default}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:600;background:rgba(180,83,9,.15);color:var(--amb);white-space:nowrap}
.pill.bad{background:rgba(17,24,39,.15);color:var(--red)}.pill.ok{background:rgba(107,114,128,.15);color:var(--grn)}.pill.mute{background:var(--line);color:var(--m)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin:10px 0 6px}
.stack i{display:block}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.row{display:grid;grid-template-columns:38% 1fr 56px;gap:8px;align-items:center;margin:4px 0;font-size:12px;border-radius:4px;padding:1px 4px}
.row[data-f]{cursor:pointer}.row[data-f]:hover{background:var(--line)}
.lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row b{text-align:right}
.bar2{background:var(--line);height:8px;border-radius:4px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--acc)}
.chart{width:100%;height:auto}.gl{stroke:var(--line)}.ax{fill:var(--m);font-size:11px}
.hl{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
@media print{nav{display:none}.tw{max-height:none}}
</style>
</head>
<body>
<header><div class="w"><div class="eyebrow">Microsoft Defender resources</div><h1 id="ttl"></h1><div id="chips"></div></div></header>
<nav><div class="w"></div></nav>
<main id="main"></main>
<script id="data" type="application/json">{{data}}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>typeof v==='number'?v.toLocaleString():esc(v);
const A=null;
const CM={'#1f2328':'var(--navy)','#111827':'var(--red)','#4b5563':'var(--blu)','#374151':'var(--amb)','#6b7280':'var(--grn)','#9ca3af':'var(--gry)'};const cc=c=>CM[c]||c;
const PRE={};            // filters to apply when a tab opens (set by clicks on the overview)
let tableRoots={};
function kpi(l,v,c,s,go,f){c=cc(c);return `<div class="k" style="--c:${c}" ${go?`data-go="${go}"`:''} ${f?`data-pre='${esc(JSON.stringify(f))}'`:''}><span>${esc(l)}</span><b>${esc(v)}</b><small>${esc(s||'')}</small></div>`}
function na(t,why){return `<div class="p warn"><b>${esc(t)}</b> not available: ${esc(why||'no data for this resource in the snapshot')}</div>`}
function kv(t,pairs){return `<div class="p"><h3>${esc(t)}</h3><table>${pairs.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${fmt(v)}</td></tr>`).join('')}</table></div>`}
function pct(a,b){return b?(Math.round(1000*a/b)/10)+'%':'n/a'}
function stack(parts,total){if(!total)return'';return `<div class="stack">${parts.filter(p=>p[1]).map(p=>`<i title="${esc(p[0])}: ${p[1].toLocaleString()}" style="width:${100*p[1]/total}%;background:${p[2]}"></i>`).join('')}</div><div class="m sm">${parts.map(p=>`<span class="lg"><i style="background:${p[2]}"></i>${esc(p[0])} ${p[1].toLocaleString()}</span>`).join(' ')}</div>`}
/* bar list; items are [label,count,filterKey,filterValue]; a click opens the table with that filter */
function bars(title,items,go,sub){items=items.filter(i=>i[1]);const mx=Math.max(1,...items.map(i=>i[1]));
 return `<div class="p"><h3>${esc(title)}${sub?` <span class="m">${esc(sub)}</span>`:''}</h3>${items.length?items.map(([k,v,fk,fv])=>`<div class="row" ${go&&fk?`data-go="${go}" data-pre='${esc(JSON.stringify({[fk]:fv==null?k:fv}))}'`:''} ${go&&fk?'data-f="1"':''}><span class="lb" title="${esc(k)}">${esc(k)}</span><span class="bar2"><i style="width:${100*v/mx}%"></i></span><b>${v.toLocaleString()}</b></div>`).join(''):'<div class="m sm">No data.</div>'}</div>`}
const CLS={'Needs action':'bad','Watch':'','Healthy':'ok','Silent':'bad','Seen':'ok','High':'bad','Medium':'','Low':'','None':'ok','Disabled':'bad','EDR blocked':'bad','Active':'ok','Inactive':'bad'};
/* generic searchable, sortable, paged table with filters and CSV export of the filtered view */
function dt(cols,rows,opts){opts=opts||{};const S={q:'',sort:opts.sort||null,dir:opts.dir||1,page:0,size:25,f:Object.assign({},opts.pre||{})};if(S.f.q!==undefined){S.q=S.f.q;delete S.f.q}const root=document.createElement('div');root.className='p';
 const filters=opts.filters||[];
 function view(){let r=rows.filter(x=>{for(const f of filters){const v=S.f[f.key];if(v&&String(x[f.key])!==v)return false}
  if(S.q){const q=S.q.toLowerCase();if(!cols.some(c=>String(x[c.k]==null?'':x[c.k]).toLowerCase().includes(q)))return false}return true});
  if(S.sort){const k=S.sort;r=r.slice().sort((a,b)=>{const x=a[k],y=b[k];return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y)))*S.dir})}return r}
 function draw(){const r=view(),pages=Math.max(1,Math.ceil(r.length/S.size));if(S.page>=pages)S.page=pages-1;const sl=r.slice(S.page*S.size,(S.page+1)*S.size);
  root.innerHTML=`<h3>${esc(opts.title||'')} <span class="m">(<span data-n>${r.length.toLocaleString()}</span> of ${rows.length.toLocaleString()})</span></h3><div class="bar">
   <input type="search" placeholder="Search" value="${esc(S.q)}" data-a="q">
   ${filters.map(f=>`<select data-f="${f.key}"><option value="">${esc(f.label)}: all</option>${f.opts.map(o=>`<option ${S.f[f.key]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`).join('')}
   <select data-a="size">${[25,50,100,250].map(n=>`<option ${n===S.size?'selected':''}>${n}</option>`).join('')}</select>
   <button data-a="csv">Export CSV</button></div>
   <div class="tw"><table><thead><tr>${cols.map(c=>`<th data-s="${c.k}" class="${c.num?'r':''}">${esc(c.h)}${S.sort===c.k?(S.dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${sl.map(x=>`<tr>${cols.map(c=>`<td class="${c.num?'r':''} ${c.host?'hl':''} ${c.w?'w':''}">${c.pill?`<span class="pill ${CLS[x[c.k]]||''}">${esc(x[c.k])}</span>`:fmt(x[c.k])}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}" class="m">No rows match.</td></tr>`}</tbody></table></div>
   <div class="bar"><button data-a="prev" ${S.page?'':'disabled'}>Prev</button><span class="m">Page ${S.page+1} of ${pages}</span><button data-a="next" ${S.page<pages-1?'':'disabled'}>Next</button></div>`;
  const q=root.querySelector('[data-a=q]');q.oninput=e=>{S.q=e.target.value;S.page=0;const p=e.target.selectionStart;draw();const n=root.querySelector('[data-a=q]');n.focus();n.setSelectionRange(p,p)};
  root.querySelectorAll('[data-f]').forEach(s=>s.onchange=e=>{S.f[s.dataset.f]=e.target.value;S.page=0;draw()});
  root.querySelector('[data-a=size]').onchange=e=>{S.size=+e.target.value;S.page=0;draw()};
  root.querySelector('[data-a=prev]').onclick=()=>{S.page--;draw()};root.querySelector('[data-a=next]').onclick=()=>{S.page++;draw()};
  root.querySelectorAll('th[data-s]').forEach(h=>h.onclick=()=>{if(S.sort===h.dataset.s)S.dir*=-1;else{S.sort=h.dataset.s;S.dir=1}draw()});
  root.querySelector('[data-a=csv]').onclick=()=>{const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const t=[cols.map(c=>q(c.h)).join(',')].concat(view().map(x=>cols.map(c=>q(x[c.k])).join(','))).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=(opts.file||'export')+'.csv';a.click()}}
 draw();return root}
const uniq=(rows,k)=>[...new Set(rows.map(r=>r[k]))].filter(v=>v!==''&&v!=null).sort();
const V={};
const F=D.fleet,H=D.hosts,AV=D.av,VU=D.vuln,CF=D.config,RC=D.recs,AL=D.alerts,E=D.summary,SS=D.secureScore,N=F.onboarded;
const TABS=[['ov','Overview'],['ho','Devices'],['vu','Vulnerabilities'],['cf','Configuration'],['al','Alerts'],['cv','Coverage']];
const SRC={microsoftDefenderForEndpoint:'Defender for Endpoint',microsoftDefenderForOffice365:'Defender for Office 365',dataLossPrevention:'Data loss prevention'};
/* ---------------- Overview ---------------- */
V.ov=()=>{const c=document.createElement('div');
 const kp=[kpi('Onboarded devices',N.toLocaleString(),'#1f2328','of '+F.devices.toLocaleString()+' known to Defender','ho'),
  kpi('Need action',E.needsAction.toLocaleString(),E.needsAction?'#111827':'#6b7280',E.watch.toLocaleString()+' more on watch','ho',{state:'Needs action'}),
  kpi('Secure Score',SS.score.toLocaleString(),'#4b5563','points, '+SS.time,'cf'),
  kpi('High exposure',H.exposureHigh.toLocaleString(),H.exposureHigh?'#374151':'#6b7280',pct(H.exposureHigh,N)+' of onboarded','ho',{exposure:'High'}),
  kpi('Exploitable CVEs',VU.exploitDevices.toLocaleString(),VU.exploitDevices?'#111827':'#6b7280','devices with a verified exploit','vu'),
  kpi('Open alerts',AL.mdeOpenScored.toLocaleString(),AL.openHigh?'#111827':AL.mdeOpenScored?'#374151':'#6b7280',AL.openHigh+' high, informational excluded','al')];
 const colors=['#6b7280','#4b5563','#374151','#111827','#1f2328','#9ca3af'];
 c.innerHTML=`<div class="g k3">${kp.join('')}</div>
  <div class="p"><h3>Enrolment <span class="m">${F.devices.toLocaleString()} devices known to Defender</span></h3>${stack([['Onboarded',N,'#6b7280'],['Can be onboarded',F.canBeOnboarded,'#4b5563'],['Insufficient information',F.insufficientInfo,'#374151'],['Unsupported',F.unsupported,'#9ca3af']],F.devices)}</div>
  <div class="p"><h3>Onboarded devices by last seen</h3>${stack(Object.entries(H.seenBuckets).map(([k,v],i)=>[k,v,colors[i%6]]),N)}</div>
  <div class="g c2" id="g1"></div><div class="g c2" id="g2" style="margin-top:12px"></div>
  <div class="p read">Snapshot <b>${esc(D.snapshot)}</b>. Click a tile or a bar to open the table behind it. Scores cover onboarded devices only; informational alerts are not scored.</div>`;
 const g1=c.querySelector('#g1'),g2=c.querySelector('#g2');
 g1.insertAdjacentHTML('beforeend',bars('Operating systems',H.os.slice(0,10).map(v=>[v.name,v.count])));
 g1.insertAdjacentHTML('beforeend',bars('Device groups',H.groups.map(v=>[v.name,v.count])));
 g2.insertAdjacentHTML('beforeend',kv('Antivirus health',AV.mode.map(m=>['Mode: '+m.name,m.count]).concat([['Signatures out of date',AV.sigOutdated],['Engine or platform out of date',AV.platformOutdated]])));
 g2.insertAdjacentHTML('beforeend',bars('Exposure and risk',[['High exposure',H.exposureHigh,'exposure','High'],['Medium exposure',H.exposureMedium,'exposure','Medium'],['High risk score',H.riskHigh,'risk','High'],['Medium risk score',H.riskMedium,'risk','Medium'],['Sensor inactive',H.sensorInactive,'health','Inactive']],'ho'));
 return c};
/* ---------------- Devices ---------------- */
V.ho=()=>{const c=document.createElement('div');
 c.innerHTML=`<div class="g k4"><div class="k" style="--c:var(--red)" data-go="ho" data-pre='{"state":"Needs action"}'><span>Need action</span><b>${E.needsAction.toLocaleString()}</b><small>score 3 or more</small></div><div class="k" style="--c:var(--amb)" data-go="ho" data-pre='{"state":"Watch"}'><span>Watch</span><b>${E.watch.toLocaleString()}</b><small>score 1 to 2</small></div><div class="k" style="--c:var(--grn)"><span>Healthy</span><b>${E.healthy.toLocaleString()}</b><small>no open issue; not listed</small></div><div class="k" style="--c:var(--navy)"><span>Onboarded</span><b>${N.toLocaleString()}</b><small>${H.listed.toLocaleString()} listed below</small></div></div>`;
 const R=D.rows;
 const cols=[{k:'name',h:'Device',host:1},{k:'state',h:'Status',pill:1},{k:'score',h:'Score',num:1},{k:'checkin',h:'Last seen',pill:1},{k:'seenDays',h:'Days',num:1},{k:'os',h:'OS'},{k:'exposure',h:'Exposure',pill:1},{k:'risk',h:'Risk',pill:1},{k:'av',h:'Antivirus'},{k:'exploit',h:'Exploitable CVEs',num:1},{k:'critical',h:'Critical CVEs',num:1},{k:'openAlerts',h:'Open alerts',num:1},{k:'reasons',h:'Why',w:1}];
 c.appendChild(dt(cols,R,{title:'Devices',file:'defender_devices',sort:'score',dir:-1,pre:PRE.ho,
  filters:[{key:'state',label:'Status',opts:['Needs action','Watch']},{key:'checkin',label:'Last seen',opts:['Silent','Seen']},{key:'os',label:'OS',opts:uniq(R,'os')},{key:'exposure',label:'Exposure',opts:uniq(R,'exposure')},{key:'risk',label:'Risk',opts:uniq(R,'risk')},{key:'health',label:'Health',opts:uniq(R,'health')},{key:'av',label:'Antivirus',opts:uniq(R,'av')}]}));return c};
/* ---------------- Vulnerabilities ---------------- */
V.vu=()=>{const c=document.createElement('div');
 c.innerHTML=`<div class="g k3">${kpi('Devices with CVEs',VU.devices.toLocaleString(),'#374151',pct(VU.devices,N)+' of onboarded')}${kpi('With a critical CVE',VU.criticalDevices.toLocaleString(),VU.criticalDevices?'#111827':'#6b7280','devices')}${kpi('With an exploitable CVE',VU.exploitDevices.toLocaleString(),VU.exploitDevices?'#111827':'#6b7280','High or Critical, verified exploit')}</div><div style="height:12px"></div>`;
 c.appendChild(dt([{k:'severity',h:'Severity'},{k:'exploit',h:'Exploit'},{k:'cves',h:'CVEs',num:1},{k:'devices',h:'Devices',num:1}],VU.severity,{title:'By severity and exploit',file:'defender_vuln_severity',sort:'cves',dir:-1}));
 const a=dt([{k:'cve',h:'CVE',host:1},{k:'severity',h:'Severity'},{k:'exploit',h:'Exploit'},{k:'devices',h:'Devices',num:1},{k:'cvss',h:'CVSS',num:1},{k:'software',h:'Software'}],VU.cves,{title:'Top exploitable CVEs',file:'defender_cves',sort:'devices',dir:-1});a.style.marginTop='12px';c.appendChild(a);
 const b=dt([{k:'vendor',h:'Vendor'},{k:'software',h:'Software'},{k:'cves',h:'Critical CVEs',num:1},{k:'devices',h:'Devices',num:1}],VU.software,{title:'Software with the most critical CVEs',file:'defender_software',sort:'cves',dir:-1});b.style.marginTop='12px';c.appendChild(b);return c};
/* ---------------- Configuration ---------------- */
V.cf=()=>{const c=document.createElement('div');
 c.innerHTML=`<div class="g k3">${kpi('Secure Score',SS.score.toLocaleString(),'#4b5563','points, '+SS.time)}${kpi('Settings compliant',pct(CF.compliant,CF.applicable),'#374151',CF.compliant.toLocaleString()+' of '+CF.applicable.toLocaleString()+' applicable checks')}${kpi('Active recommendations',RC.count.toLocaleString(),'#1f2328',RC.publicExploit+' with a public exploit')}</div><div style="height:12px"></div>`;
 c.appendChild(dt([{k:'category',h:'Category'},{k:'applicable',h:'Applicable checks',num:1},{k:'compliant',h:'Compliant',num:1},{k:'pct',h:'Compliance %',num:1},{k:'devices',h:'Devices',num:1}],CF.categories,{title:'Secure configuration by category',file:'defender_config_categories',sort:'pct',dir:1}));
 const a=dt([{k:'configuration',h:'Setting',w:1},{k:'category',h:'Category'},{k:'devices',h:'Devices failing',num:1},{k:'impact',h:'Impact',num:1}],CF.top,{title:'Most common failing settings',file:'defender_config_failing',sort:'devices',dir:-1});a.style.marginTop='12px';c.appendChild(a);
 const b=dt([{k:'recommendation',h:'Recommendation',w:1},{k:'category',h:'Category'},{k:'severity',h:'Severity',num:1},{k:'exposed',h:'Exposed devices',num:1},{k:'publicExploit',h:'Public exploit'}],RC.top.map(r=>Object.assign({},r,{publicExploit:r.publicExploit?'yes':'no'})),{title:'Top security recommendations',file:'defender_recommendations',sort:'exposed',dir:-1});b.style.marginTop='12px';c.appendChild(b);return c};
/* ---------------- Alerts ---------------- */
V.al=()=>{const c=document.createElement('div');
 c.innerHTML=`<div class="g k4">${kpi('Alerts in window',AL.total.toLocaleString(),'#1f2328','last '+AL.windowDays+' days, all products')}${kpi('Open endpoint alerts',AL.mdeOpenScored.toLocaleString(),AL.mdeOpenScored?'#374151':'#6b7280','informational excluded')}${kpi('Open high severity',AL.openHigh.toLocaleString(),AL.openHigh?'#111827':'#6b7280',AL.devicesOpenHigh+' devices')}${kpi('Open incidents',AL.incidentsOpen.toLocaleString(),AL.incidentsOpen?'#374151':'#6b7280','of '+AL.incidentsTotal.toLocaleString())}</div>
  <div class="g c2" id="a1" style="margin-top:12px"></div>`;
 const g=c.querySelector('#a1');
 g.insertAdjacentHTML('beforeend',bars('By severity',AL.bySeverity.map(v=>[v.name,v.count])));
 g.insertAdjacentHTML('beforeend',bars('By product',AL.bySource.map(v=>[SRC[v.name]||v.name,v.count])));
 g.insertAdjacentHTML('beforeend',bars('By status',AL.byStatus.map(v=>[v.name,v.count])));
 g.insertAdjacentHTML('beforeend',bars('Incidents',AL.incidents.map(v=>[v.severity+', '+v.status,v.count])));
 const t=dt([{k:'title',h:'Alert',w:1},{k:'alerts',h:'Alerts',num:1},{k:'open',h:'Open',num:1}],AL.titles,{title:'Most common endpoint alerts',file:'defender_alert_titles',sort:'alerts',dir:-1});t.style.marginTop='12px';c.appendChild(t);
 const h=dt([{k:'host',h:'Device',host:1},{k:'os',h:'OS'},{k:'alerts',h:'Alerts',num:1},{k:'open',h:'Open',num:1},{k:'highOpen',h:'High open',num:1},{k:'last',h:'Last alert'},{k:'top',h:'Most common',w:1}],AL.hosts,{title:'Devices with open alerts (informational excluded)',file:'defender_alert_devices',sort:'highOpen',dir:-1});h.style.marginTop='12px';c.appendChild(h);
